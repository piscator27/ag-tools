<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Zahlenrad">
<meta name="mobile-web-app-capable" content="yes">
<title>Zahlenrad – Zufallszahl auswählen</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314181f'/%3E%3Ctext x='50' y='66' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%238a8f99' text-anchor='middle'%3EFi%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg: #10141b;
    --bg-vignette: radial-gradient(ellipse at 50% 38%, #1a2028 0%, #10141b 62%, #0a0d12 100%);
    --panel: #1a2028;
    --panel-border: #2a3240;
    --ink: #f2efe7;
    --ink-dim: #9aa3b2;
    --accent: #e8a33d;
    --accent-dim: #a9762c;
    --accent-glow: rgba(232,163,61,0.55);
    --segA: #1c2836;
    --segB: #232f3f;
    --seg-text: #f2efe7;
    --danger: #c0553f;
    --logo: #6b7280;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-vignette);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 1.4vh 0 0 0;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    letter-spacing: 0.08em;
    margin-bottom: 0.4vh;
  }
  header h1{
    font-size: clamp(20px, 3vw, 34px);
    font-weight:700;
    margin:0;
    color: var(--ink);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  header .line{
    width:120px; height:2px; margin:10px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  /* ---------- Result display ---------- */
  #resultBox{
    display:flex; align-items:center; justify-content:center;
    gap: 18px;
    margin: 0.6vh 0 0.2vh 0;
    min-height: 9vh;
  }
  #resultLabel{
    font-size: clamp(13px, 1.4vw, 16px);
    color: var(--ink-dim);
    text-transform:uppercase;
    letter-spacing: 0.15em;
  }
  #resultNumber{
    font-size: clamp(48px, 9vw, 100px);
    font-weight:800;
    line-height:1;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
    min-width: 2ch;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Wheel area ---------- */
  #wheelWrap{
    position:relative;
    flex: 1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height: 0;
  }
  #wheelCanvasHolder{
    position:relative;
    width: min(72vh, 62vw);
    height: min(72vh, 62vw);
  }
  canvas#wheel{
    width:100%; height:100%;
    display:block;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.6));
    cursor:pointer;
    transition: filter .2s ease;
  }
  canvas#wheel:active{ filter: drop-shadow(0 6px 24px rgba(0,0,0,0.6)); }

  #hub{
    position:absolute; left:50%; top:50%;
    width: 15%; height:15%;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3a4351, #171c24 72%);
    border: 2px solid var(--panel-border);
    box-shadow: 0 0 0 4px rgba(0,0,0,0.35), inset 0 2px 6px rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #hub svg{ width:42%; height:42%; opacity:0.85; }

  #pointer{
    position:absolute;
    top: -2.2%;
    left:50%;
    transform: translateX(-50%);
    width: 6%;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    z-index:5;
    pointer-events:none;
  }

  #spinHint{
    position:absolute;
    bottom: -6%;
    left:50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 1.1vw, 14px);
    color: var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  /* ---------- Bottom control bar ---------- */
  #controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 26px;
    flex-wrap: wrap;
    padding: 1.2vh 3vw 1.4vh;
  }
  .ctrl-group{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 8px 16px;
    border-radius: 14px;
  }
  .ctrl-group label{
    font-size: clamp(12px, 1.1vw, 15px);
    color: var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    white-space:nowrap;
  }
  #maxInput{
    width: 5ch;
    background: #0f131a;
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-size: clamp(16px,1.6vw,20px);
    font-weight:700;
    text-align:center;
    padding: 6px 4px;
    border-radius: 8px;
    -moz-appearance: textfield;
  }
  #maxInput::-webkit-outer-spin-button,
  #maxInput::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
    color: var(--ink);
    background: transparent;
    letter-spacing:0.05em;
  }
  .btn{
    padding: 10px 18px;
    border-radius: 10px;
    font-size: clamp(13px,1.3vw,16px);
    font-weight:600;
    border: 1px solid var(--panel-border);
    background: #222a35;
    transition: transform .1s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover{ background:#28323f; }
  .btn:active{ transform: scale(0.96); }
  .btn.primary{
    background: linear-gradient(180deg, #f0b354, var(--accent-dim));
    color: #201305;
    border-color: transparent;
    font-weight:700;
  }
  .btn.primary:hover{ filter: brightness(1.06); }
  .btn.ghost{ background:transparent; color: var(--ink-dim); border-color: var(--panel-border); }
  .btn.ghost:hover{ color: var(--ink); border-color: var(--ink-dim); }

  input[type=checkbox]{
    width:18px; height:18px;
    accent-color: var(--accent);
  }

  /* ---------- History strip ---------- */
  #history{
    position:absolute;
    top: 10px;
    right: 14px;
    max-width: 30vw;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:flex-end;
    font-size: clamp(11px,1vw,13px);
    color: var(--ink-dim);
  }
  #history .chip{
    background: var(--panel);
    border:1px solid var(--panel-border);
    padding:3px 9px;
    border-radius: 999px;
  }

  /* ---------- Logo ---------- */
  #logo{
    position:fixed;
    right: 18px;
    bottom: 12px;
    font-size: 15px;
    font-weight:700;
    color: var(--logo);
    letter-spacing: 0.03em;
    opacity: 0.55;
    pointer-events:none;
    user-select:none;
  }

  /* ---------- Fullscreen button ---------- */
  #fsBtn{
    position:fixed;
    left:14px;
    top:12px;
    width:34px; height:34px;
    border-radius:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim);
    opacity:0.6;
  }
  #fsBtn:hover{ opacity:1; color:var(--ink); }
  #fsBtn svg{ width:16px; height:16px; }

  @media (max-height: 560px){
    header{ display:none; }
    #resultBox{ min-height: 7vh; }
  }
</style>
</head>
<body>
<div id="app">

  <button id="fsBtn" title="Vollbild umschalten" aria-label="Vollbild umschalten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>

  <div id="history"></div>

  <header>
    <h1>Zahlenrad</h1>
    <div class="line"></div>
  </header>

  <div id="resultBox">
    <span id="resultLabel">Ergebnis</span>
    <span id="resultNumber">–</span>
  </div>

  <div id="wheelWrap">
    <div id="wheelCanvasHolder">
      <img id="pointer" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 80'%3E%3Cpath d='M30 80 C10 46 6 34 6 24 a24 24 0 1 1 48 0 c0 10 -4 22 -24 56 Z' fill='%23e8a33d' stroke='%2310141b' stroke-width='3'/%3E%3Ccircle cx='30' cy='24' r='9' fill='%2310141b'/%3E%3C/svg%3E">
      <canvas id="wheel" width="1000" height="1000"></canvas>
      <div id="hub">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      </div>
      <div id="spinHint"></div>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <label for="maxInput">Max. Zahl (2–50)</label>
      <input id="maxInput" type="number" min="1" max="50" value="20" inputmode="numeric">
      <button class="btn ghost" id="applyMax">Übernehmen</button>
    </div>
    <div class="ctrl-group">
      <label for="noRepeat">Ohne Wiederholung</label>
      <input type="checkbox" id="noRepeat">
    </div>
    <button class="btn ghost" id="resetHistory">Verlauf löschen</button>
    <button class="btn primary" id="spinBtn">Drehen</button>
  </div>

  <div id="logo">Fi</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const holder = document.getElementById('wheelCanvasHolder');
  const resultNumber = document.getElementById('resultNumber');
  const maxInput = document.getElementById('maxInput');
  const applyMax = document.getElementById('applyMax');
  const spinBtn = document.getElementById('spinBtn');
  const noRepeat = document.getElementById('noRepeat');
  const resetHistoryBtn = document.getElementById('resetHistory');
  const historyEl = document.getElementById('history');
  const fsBtn = document.getElementById('fsBtn');

  const COLORS = ['#1c2836', '#232f3f'];
  const TEXT_COLOR = '#f2efe7';
  const ACCENT = '#e8a33d';

  let maxZahl = 20;
  let numbers = [];
  let usedNumbers = new Set();
  let currentRotation = 0; // radians
  let spinning = false;

  function buildNumbers(){
    numbers = [];
    for(let i=1;i<=maxZahl;i++) numbers.push(i);
  }

  function segAngle(){ return (2*Math.PI) / numbers.length; }

  function drawWheel(){
    const size = canvas.width;
    const cx = size/2, cy = size/2;
    const radius = size/2 - 6;
    ctx.clearRect(0,0,size,size);

    const n = numbers.length;
    const a = segAngle();
    const fontSize = n <= 12 ? size*0.055 : n <= 24 ? size*0.042 : n <= 36 ? size*0.033 : size*0.026;

    for(let i=0;i<n;i++){
      const start = currentRotation + i*a;
      const end = start + a;
      const isUsed = usedNumbers.has(numbers[i]);

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,start,end);
      ctx.closePath();
      ctx.fillStyle = isUsed ? '#12161c' : COLORS[i % 2];
      ctx.fill();
      ctx.lineWidth = size*0.0025;
      ctx.strokeStyle = '#0a0d12';
      ctx.stroke();

      // number label
      const mid = start + a/2;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = isUsed ? '#4a5261' : TEXT_COLOR;
      ctx.font = `700 ${fontSize}px "Segoe UI", Helvetica, Arial, sans-serif`;
      ctx.fillText(String(numbers[i]), radius - size*0.035, 0);
      ctx.restore();
    }

    // outer ring
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,2*Math.PI);
    ctx.lineWidth = size*0.012;
    ctx.strokeStyle = '#2a3240';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx,cy,radius+size*0.006,0,2*Math.PI);
    ctx.lineWidth = size*0.004;
    ctx.strokeStyle = ACCENT;
    ctx.globalAlpha = 0.6;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function resizeCanvas(){
    const rect = holder.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cssSize = Math.min(rect.width, rect.height);
    canvas.width = cssSize * dpr;
    canvas.height = cssSize * dpr;
    canvas.style.width = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    drawWheel();
  }

  function easeOutCubicBounce(t){
    // ease-out with slight settle
    return 1 - Math.pow(1-t, 4);
  }

  function pickAvailableIndex(){
    let candidates = numbers.map((v,i)=>i).filter(i => !usedNumbers.has(numbers[i]));
    if(noRepeat.checked && candidates.length === 0){
      usedNumbers.clear();
      candidates = numbers.map((v,i)=>i);
    }
    if(!noRepeat.checked) candidates = numbers.map((v,i)=>i);
    return candidates[Math.floor(Math.random()*candidates.length)];
  }

  function spin(){
    if(spinning) return;
    if(numbers.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;

    const targetIndex = pickAvailableIndex();
    const a = segAngle();

    // pointer is fixed at top (angle = -PI/2 in canvas coords, i.e. 270deg / -90deg)
    // segment i occupies [currentRotation + i*a, currentRotation + (i+1)*a) measured from angle 0 (pointing right, clockwise)
    // We want the middle of targetIndex segment to align with pointer angle (-90deg / -PI/2)
    const pointerAngle = -Math.PI/2;
    const segMidOffset = targetIndex*a + a/2;

    // normalize current rotation to [0, 2PI)
    const twoPI = Math.PI*2;
    let curNorm = ((currentRotation % twoPI) + twoPI) % twoPI;

    // desired final rotation (mod 2PI) such that: finalRotation + segMidOffset ≡ pointerAngle (mod 2PI)
    let desiredFinalNorm = ((pointerAngle - segMidOffset) % twoPI + twoPI) % twoPI;

    // add extra full spins for effect
    const extraSpins = 5 + Math.floor(Math.random()*3); // 5-7 spins
    let delta = desiredFinalNorm - curNorm;
    delta = ((delta % twoPI) + twoPI) % twoPI; // positive shortest forward delta
    const totalDelta = delta + extraSpins*twoPI;

    const startRotation = currentRotation;
    const endRotation = currentRotation + totalDelta;
    const duration = 4200 + Math.random()*800;
    const startTime = performance.now();

    resultNumber.textContent = '–';

    function frame(now){
      const t = Math.min(1, (now - startTime)/duration);
      const eased = easeOutCubicBounce(t);
      currentRotation = startRotation + (endRotation-startRotation)*eased;
      drawWheel();
      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        currentRotation = endRotation;
        drawWheel();
        finishSpin(targetIndex);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(index){
    spinning = false;
    spinBtn.disabled = false;
    const value = numbers[index];
    resultNumber.textContent = value;
    if(noRepeat.checked){
      usedNumbers.add(value);
      drawWheel();
    }
    pushHistory(value);
    pulseResult();
  }

  function pulseResult(){
    resultNumber.animate([
      { transform:'scale(1.25)', textShadow:'0 0 46px rgba(232,163,61,0.9)' },
      { transform:'scale(1)', textShadow:'0 0 30px rgba(232,163,61,0.55)' }
    ], { duration: 420, easing:'ease-out' });
  }

  let historyList = [];
  function pushHistory(v){
    historyList.unshift(v);
    if(historyList.length > 12) historyList.pop();
    renderHistory();
  }
  function renderHistory(){
    historyEl.innerHTML = historyList.map(v => `<span class="chip">${v}</span>`).join('');
  }

  function rebuildWheel(){
    let v = parseInt(maxInput.value, 10);
    if(isNaN(v)) v = 20;
    v = Math.max(1, Math.min(50, v));
    maxInput.value = v;
    maxZahl = v;
    buildNumbers();
    usedNumbers.clear();
    currentRotation = 0;
    resultNumber.textContent = '–';
    historyList = [];
    renderHistory();
    drawWheel();
  }

  applyMax.addEventListener('click', rebuildWheel);
  maxInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ rebuildWheel(); maxInput.blur(); }});
  spinBtn.addEventListener('click', spin);
  canvas.addEventListener('click', spin);
  resetHistoryBtn.addEventListener('click', ()=>{
    usedNumbers.clear();
    historyList = [];
    renderHistory();
    resultNumber.textContent = '–';
    drawWheel();
  });

  fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.();
    }
  });

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', ()=> setTimeout(resizeCanvas, 250));

  // Prevent iPad double-tap zoom / scroll bounce
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if(e.scale !== 1) e.preventDefault(); }, { passive:false });

  buildNumbers();
  resizeCanvas();
})();
</script>
</body>
</html>
