<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbeitszeit</title><style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
#header{width:340px;display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
#title{font-size:30px}#preset{font-size:22px;color:#bbb}
#controls{display:flex;gap:10px;margin-bottom:10px}
select,button{font-size:18px;padding:8px 14px;border:none;border-radius:8px}
svg{width:340px;height:520px}#time{font-size:64px;font-weight:bold;margin-top:8px}
#fi{position:fixed;right:14px;bottom:10px;color:#666;opacity:.75;user-select:none}
</style></head><body>
<div id="header"><div id="title">Arbeitszeit</div><div id="preset">2 min</div></div>
<div id="controls"><select id="minutes"></select><button id="startBtn">▶</button><button id="pauseBtn">⏸</button><button id="resetBtn">↺</button></div>
<svg viewBox="0 0 300 450"><defs><clipPath id="topClip"><path d="M78 42 L222 42 L150 205 Z"/></clipPath><clipPath id="bottomClip"><path d="M150 245 L78 408 L222 408 Z"/></clipPath></defs>
<path d="M70 20 L230 20 Q230 80 150 225 Q70 80 70 20 M70 430 L230 430 Q230 370 150 225 Q70 370 70 430" fill="none" stroke="#d8d8d8" stroke-width="9"/>
<g clip-path="url(#topClip)"><polygon id="topSand" fill="#d8b34b"/></g>
<g clip-path="url(#bottomClip)"><polygon id="bottomSand" fill="#d8b34b"/></g>
<line id="stream" x1="150" y1="205" x2="150" y2="245" stroke="#f5d46c" stroke-width="2.5" stroke-linecap="round"/></svg>
<div id="time"></div><div id="fi">Fi</div>
<script>
const sel=document.getElementById("minutes");for(let i=1;i<=60;i++){let o=new Option(i+" min",i);if(i===2)o.selected=true;sel.add(o);}
let total=120,remaining=120,running=false,timer=null;
const topSand=document.getElementById("topSand"),bottomSand=document.getElementById("bottomSand"),stream=document.getElementById("stream");
function fmt(s){let m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function update(){time.textContent=fmt(remaining);let p=remaining/total;let y=42+(1-p)*163;topSand.setAttribute("points",`78,${y} 222,${y} 150,205`);let f=1-p;let hw=4+68*f;let topY=408-163*f;bottomSand.setAttribute("points",`${150-hw},408 ${150+hw},408 150,${topY}`);stream.style.display=remaining?"block":"none";}
function animate(){if(!running)return;let t=performance.now()/120;stream.setAttribute("stroke-width",(2.2+.6*Math.sin(t)).toFixed(2));stream.setAttribute("opacity",(.82+.18*Math.sin(t*1.8)).toFixed(2));requestAnimationFrame(animate);}
function gong(){const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=523;o.connect(g);g.connect(c.destination);g.gain.value=.25;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1.3);o.start();o.stop(c.currentTime+1.3);}
function tick(){remaining--;if(remaining<=0){remaining=0;pause();gong();}update();}
function start(){if(running)return;running=true;preset.style.visibility="hidden";requestAnimationFrame(animate);timer=setInterval(tick,1000);}
function pause(){running=false;clearInterval(timer);stream.setAttribute("stroke-width","2.5");stream.setAttribute("opacity","1");}
function resetTimer(){pause();total=Number(sel.value)*60;remaining=total;preset.textContent=sel.value+" min";preset.style.visibility="visible";update();}
startBtn.onclick=start;pauseBtn.onclick=pause;resetBtn.onclick=resetTimer;sel.onchange=resetTimer;resetTimer();
</script></body></html>
