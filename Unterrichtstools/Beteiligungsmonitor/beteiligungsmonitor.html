<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Verhindert Zoomen/Scrollen per Geste auf dem iPad, damit die Bedienung mit dem Finger zuverlässig bleibt -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beteiligungsmonitor</title>
<style>

  /* ======================================================================
     GRUNDEINSTELLUNGEN
     ====================================================================== */
  :root{
    --bg:            #f4f5f3;      /* ruhiger, neutraler Hintergrund */
    --panel-bg:      #ffffff;
    --line:          #d8dbd6;
    --text:          #1f2421;
    --text-soft:     #5c6660;

    --offen-accent:  #2f6f5e;      /* gedecktes Grün: "noch offen" */
    --offen-bg:      #eef4f1;

    --erledigt-accent: #9aa39c;    /* gedämpftes Grau-Grün: "erledigt", bewusst zurückgenommen */
    --erledigt-bg:   #f1f2f0;

    --radius: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    margin: 0;
    overscroll-behavior: none;   /* kein "Nachwippen" beim Scrollen auf iOS */
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 10px 14px 14px;
    user-select: none;            /* kein versehentliches Markieren von Text bei schnellem Tippen */
  }

  /* ======================================================================
     KOPFBEREICH: Klasse wählen + Statuszeile
     ====================================================================== */
  header{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .kopf-links{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  select#klassenwahl{
    font-size: 1rem;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-bg);
    color: var(--text);
  }

  .status{
    font-size: 0.95rem;
    color: var(--text-soft);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .status strong{ color: var(--text); }

  button#reset-btn{
    font-size: 0.95rem;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
  }
  button#reset-btn:active{ background: var(--line); }

  /* ======================================================================
     HAUPTBEREICH: zwei Spalten nebeneinander
     ====================================================================== */
  main{
    flex: 1 1 auto;
    display: flex;
    gap: 12px;
    min-height: 0;   /* wichtig, damit Kinder nicht über den Bildschirm hinauswachsen */
  }

  .spalte{
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-radius: var(--radius);
    padding: 10px;
    overflow: hidden;   /* bewusst kein Scrollen -- Ziel ist Übersicht ohne Wischen */
  }

  .spalte.offen{     background: var(--offen-bg); }
  .spalte.erledigt{  background: var(--erledigt-bg); }

  .spalte h2{
    margin: 2px 4px 8px;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .spalte.offen h2{    color: var(--offen-accent); }
  .spalte.erledigt h2{ color: var(--erledigt-accent); }

  /* Rasterlayout: passt sich an Anzahl der Namen an, damit alle ohne
     Scrollen sichtbar bleiben. */
  .namen-raster{
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    grid-auto-rows: 1fr;
    gap: 6px;
    align-content: start;
  }

  /* ======================================================================
     NAMENS-KACHELN
     ====================================================================== */
  .name-btn{
    font-family: inherit;
    font-size: clamp(0.85rem, 1.6vw, 1.15rem);
    font-weight: 500;
    border: none;
    border-radius: 8px;
    padding: 4px 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    cursor: pointer;
    min-height: 44px;   /* Mindestgröße für zuverlässige Fingerbedienung */
  }

  .spalte.offen .name-btn{
    background: var(--panel-bg);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .spalte.offen .name-btn:active{
    background: var(--offen-accent);
    color: #fff;
  }

  .spalte.erledigt .name-btn{
    background: transparent;
    color: var(--text-soft);
    border: 1px solid transparent;
    text-decoration: line-through;
  }
  .spalte.erledigt .name-btn:active{
    background: var(--panel-bg);
  }

  /* Leerer Zustand, falls ein Bereich vollständig leer ist */
  .leer-hinweis{
    color: var(--text-soft);
    font-size: 0.9rem;
    padding: 8px;
  }

</style>
</head>
<body>

  <header>
    <div class="kopf-links">
      <select id="klassenwahl"></select>
      <button id="reset-btn">Alle zurücksetzen</button>
    </div>

    <div class="status" id="status-zeile">
      <!-- wird per JavaScript befüllt -->
    </div>
  </header>

  <main>
    <section class="spalte offen">
      <h2>Noch nicht beteiligt</h2>
      <div class="namen-raster" id="raster-offen"></div>
    </section>

    <section class="spalte erledigt">
      <h2>Schon beteiligt</h2>
      <div class="namen-raster" id="raster-erledigt"></div>
    </section>
  </main>

<!-- Echte Klassenlisten (lokal, nicht im Repo). Fehlt die Datei,
     greifen die Beispielnamen weiter unten. -->
<script src="klassen.js"></script>
<script>
  /* ========================================================================
     DATEN
     ------------------------------------------------------------------------
     Hier werden die Klassen gepflegt. Jede Klasse ist ein Objekt mit einem
     Namen (wird im Auswahlmenü angezeigt) und einer Liste von Schülernamen.

     Um eine weitere Klasse hinzuzufügen, einfach ein weiteres Objekt in das
     Array KLASSEN einfügen, z. B.:

     { name: "6b", schueler: ["Anna Muster", "Ben Beispiel", ...] }

     Aktuell sind nur Platzhalternamen ("Name1", "Name2", ...) hinterlegt.
     ==================================================================== */
  const KLASSEN = window.KLASSEN || [
    { name: "Beispielklasse A", schueler: [
      "Anna", "Ben", "Clara", "David", "Elif", "Finn", "Greta", "Hugo", "Ida", "Jonas",
      "Karla", "Leon", "Mara", "Nico", "Olivia", "Paul", "Quirin", "Rosa", "Sami", "Tom",
      "Ulla", "Viktor", "Wanda", "Xenia", "Yusuf", "Zoe", "Amir", "Bea", "Carlo", "Dilara"
    ] },
    { name: "Beispielklasse B", schueler: [
      "Alina", "Bela", "Cem", "Dora", "Emil", "Frida", "Georg", "Hanna", "Ilias", "Jule",
      "Kian", "Lotta", "Mats", "Nele", "Oskar", "Pia", "Rafael", "Sina", "Theo", "Vera", "Wim",
      "Yara", "Zeno", "Anton", "Britta", "Cosima", "Dennis", "Ella", "Felix", "Gina"
    ] }
  ];

  /* ========================================================================
     ZUSTAND
     ------------------------------------------------------------------------
     Für jede Klasse wird separat gemerkt, wer sich schon beteiligt hat.
     Die Daten leben nur im Arbeitsspeicher (kein localStorage, keine Datei)
     -- das ist bewusst so, da keine Beiträge dauerhaft gespeichert werden
     sollen. Ein Neuladen der Seite setzt automatisch alles zurück.
     ==================================================================== */
  const beteiligtProKlasse = KLASSEN.map(() => new Set());

  let aktuelleKlasseIndex = 0;

  /* ========================================================================
     DOM-REFERENZEN
     ==================================================================== */
  const klassenwahl   = document.getElementById("klassenwahl");
  const rasterOffen   = document.getElementById("raster-offen");
  const rasterErledigt= document.getElementById("raster-erledigt");
  const statusZeile   = document.getElementById("status-zeile");
  const resetBtn      = document.getElementById("reset-btn");

  /* ========================================================================
     KLASSENAUSWAHL AUFBAUEN
     ==================================================================== */
  function klassenwahlAufbauen(){
    klassenwahl.innerHTML = "";
    KLASSEN.forEach((klasse, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = "Klasse " + klasse.name;
      klassenwahl.appendChild(option);
    });
  }

  klassenwahl.addEventListener("change", () => {
    aktuelleKlasseIndex = Number(klassenwahl.value);
    anzeigenAktualisieren();
  });

  /* ========================================================================
     NAMENS-KACHEL ERZEUGEN
     ==================================================================== */
  function kachelErzeugen(name, beteiligt){
    const btn = document.createElement("button");
    btn.className = "name-btn";
    btn.textContent = name;
    btn.type = "button";
    btn.addEventListener("click", () => {
      const set = beteiligtProKlasse[aktuelleKlasseIndex];
      if (beteiligt) {
        set.delete(name);   // zurück nach "noch nicht beteiligt" (Korrektur)
      } else {
        set.add(name);      // wechselt zu "schon beteiligt"
      }
      anzeigenAktualisieren();
    });
    return btn;
  }

  /* ========================================================================
     LISTE SORTIEREN (alphabetisch)
     ==================================================================== */
  function alphabetisch(namen){
    return [...namen].sort((a, b) => a.localeCompare(b, "de"));
  }

  /* ========================================================================
     ANZEIGE NEU AUFBAUEN
     ==================================================================== */
  function anzeigenAktualisieren(){
    const klasse = KLASSEN[aktuelleKlasseIndex];
    const beteiligtSet = beteiligtProKlasse[aktuelleKlasseIndex];

    const nochOffen = alphabetisch(
      klasse.schueler.filter(name => !beteiligtSet.has(name))
    );
    const schonBeteiligt = alphabetisch(
      klasse.schueler.filter(name => beteiligtSet.has(name))
    );

    // Bereich "Noch nicht beteiligt" füllen
    rasterOffen.innerHTML = "";
    if (nochOffen.length === 0) {
      const hinweis = document.createElement("div");
      hinweis.className = "leer-hinweis";
      hinweis.textContent = "Alle haben sich beteiligt.";
      rasterOffen.appendChild(hinweis);
    } else {
      nochOffen.forEach(name => {
        rasterOffen.appendChild(kachelErzeugen(name, false));
      });
    }

    // Bereich "Schon beteiligt" füllen
    rasterErledigt.innerHTML = "";
    if (schonBeteiligt.length === 0) {
      const hinweis = document.createElement("div");
      hinweis.className = "leer-hinweis";
      hinweis.textContent = "Noch niemand.";
      rasterErledigt.appendChild(hinweis);
    } else {
      schonBeteiligt.forEach(name => {
        rasterErledigt.appendChild(kachelErzeugen(name, true));
      });
    }

    // Statuszeile aktualisieren
    statusZeile.innerHTML =
      `<span><strong>Klasse ${klasse.name}</strong></span>` +
      `<span>${klasse.schueler.length} Schüler:innen</span>` +
      `<span><strong>${schonBeteiligt.length}</strong> beteiligt</span>` +
      `<span><strong>${nochOffen.length}</strong> noch offen</span>`;
  }

  /* ========================================================================
     RESET-BUTTON
     ==================================================================== */
  resetBtn.addEventListener("click", () => {
    beteiligtProKlasse[aktuelleKlasseIndex].clear();
    anzeigenAktualisieren();
  });

  /* ========================================================================
     START
     ==================================================================== */
  klassenwahlAufbauen();
  anzeigenAktualisieren();

</script>
</body>
</html>
