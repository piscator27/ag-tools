<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Einmaleins-Aufgaben</title>

<style>
:root{
    --hintergrund:#eef3f8;
    --karte:#ffffff;
    --text:#1f2a37;
    --leise:#5b6b7f;
    --blau:#2563a8;
    --blau-hell:#e3eefa;
    --orange:#c2571a;
    --orange-hell:#fdeee3;
    --gruen:#1f8a5b;
    --rand:#d5dee8;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:24px 16px 40px;
    background:var(--hintergrund);
    color:var(--text);
}

.inhalt{
    max-width:960px;
    margin:0 auto;
}

h1{
    margin:0 0 4px 0;
    font-size:30px;
    color:var(--blau);
}

.untertitel{
    margin:0 0 20px 0;
    color:var(--leise);
}

.block{
    background:var(--karte);
    padding:18px 20px;
    border-radius:12px;
    border:1px solid var(--rand);
    box-shadow:0 2px 6px rgba(31,42,55,.06);
}

.einstellungen{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 24px;
}

.einstellungen label{
    font-weight:bold;
    color:var(--leise);
}

input{
    width:64px;
    font-size:18px;
    text-align:center;
    padding:6px;
    margin-left:6px;
    border:2px solid var(--rand);
    border-radius:8px;
    color:var(--text);
}

input:focus{
    outline:none;
    border-color:var(--blau);
}

.knoepfe{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
}

button{
    font-size:17px;
    padding:9px 18px;
    border-radius:8px;
    border:2px solid var(--blau);
    background:white;
    color:var(--blau);
    cursor:pointer;
}

button:hover{
    background:var(--blau-hell);
}

button.haupt{
    background:var(--gruen);
    border-color:var(--gruen);
    color:white;
    font-weight:bold;
}

button.haupt:hover{
    background:#176e48;
}

.ergebnisse{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    margin-top:20px;
}

.ergebnisse .block{
    padding:0;
    overflow:hidden;
}

.ergebnisse h2{
    margin:0;
    padding:12px 20px;
    font-size:22px;
    color:white;
}

.ergebnisse pre{
    margin:0;
    padding:14px 20px 18px;
    font-family:inherit;
    font-size:21px;
    line-height:1.6;
    white-space:pre-wrap;
    min-height:2em;
}

.vorwaerts h2{
    background:var(--blau);
}

.vorwaerts pre{
    background:linear-gradient(var(--blau-hell),white 60px);
}

.rueckwaerts h2{
    background:var(--orange);
}

.rueckwaerts pre{
    background:linear-gradient(var(--orange-hell),white 60px);
}

.hinweis{
    font-weight:normal;
    font-size:15px;
    opacity:.85;
}

/* ---------- Abfragezettel (nur beim Drucken sichtbar) ---------- */

#zettelseite,
#aufgabenseite{
    display:none;
}

@media print{

    @page{
        size:A4;
        margin:0;
    }

    body.zettel-druck > *{
        display:none !important;
    }

    body.zettel-druck,
    body.aufgaben-druck{
        margin:0;
        padding:0;
        background:white;
    }

    body.aufgaben-druck > *{
        display:none !important;
    }

    body.aufgaben-druck #aufgabenseite{
        display:block !important;
        padding:20mm;
    }

    body.zettel-druck #zettelseite{
        display:grid !important;
        grid-template-columns:105mm 105mm;
        grid-template-rows:99mm 99mm 99mm;
        width:210mm;
        height:297mm;
        overflow:hidden;
    }

}

.zettel{
    box-sizing:border-box;
    padding:3mm 6mm 6mm 6mm;
    font-size:11pt;
    border-color:#999;
    border-style:dashed;
    border-width:0;
}

.zettel:nth-child(odd){
    border-right-width:0.3mm;
}

.zettel:nth-child(-n+4){
    border-bottom-width:0.3mm;
}

.zettel-kopf{
    display:flex;
    align-items:flex-end;
    gap:2mm;
    height:8mm;
}

.zettel-kopf .feld{
    border-bottom:0.3mm solid black;
    height:5mm;
}

.zettel-spalten{
    display:grid;
    grid-template-columns:39mm 54mm;
    margin-top:2mm;
}

.zettel-spalte:first-child{
    border-right:0.3mm solid black;
}

.zettel-spalte:last-child{
    padding-left:3mm;
}

.zettel-spalte h3{
    font-size:11pt;
    line-height:4.5mm;
    margin:0 0 1mm 0;
    padding-bottom:1mm;
    border-bottom:0.3mm solid black;
}

.zettel-spalte:first-child h3{
    margin-right:-0.3mm;
}

.zettel-spalte:last-child h3{
    margin-left:-3mm;
    padding-left:3mm;
}

.zeile{
    display:flex;
    align-items:flex-end;
    height:7.2mm;
    font-size:10pt;
}

.zeile span{
    width:6mm;
    text-align:right;
    margin-right:2mm;
}

.zeile div{
    flex:1;
    border-bottom:0.2mm solid #888;
    margin-right:3mm;
}

/* ---------- Aufgabenblatt (nur beim Drucken sichtbar) ---------- */

#aufgabenseite h1{
    font-size:20pt;
    color:black;
    margin:0 0 8mm 0;
}

#aufgabenseite h2{
    font-size:14pt;
    margin:0 0 3mm 0;
}

#aufgabenseite pre{
    font-family:Arial,Helvetica,sans-serif;
    font-size:14pt;
    line-height:1.7;
    margin:0 0 10mm 0;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="inhalt">

<h1>Einmaleins-Aufgaben</h1>
<p class="untertitel">Je 10 Aufgaben zum Vorlesen – vorwärts und rückwärts</p>

<div class="block">

<div class="einstellungen">
<label>Kleinste Reihe <input id="von" type="number" value="8" min="2" max="20"></label>
<label>Größte Reihe <input id="bis" type="number" value="14" min="2" max="20"></label>
</div>

<div class="knoepfe">
<button class="haupt" onclick="erzeuge()">Aufgaben erzeugen</button>
<button onclick="teile()">Teilen</button>
<button onclick="kopieren()">Kopieren</button>
<button onclick="aufgabenDrucken()">Aufgaben drucken</button>
<button onclick="zettelDrucken()">Abfragezettel drucken</button>
</div>

</div>


<div class="ergebnisse">

<div class="block vorwaerts">
<h2>Vorwärts <span class="hinweis">– SuS schreiben das Ergebnis</span></h2>
<pre id="vor"></pre>
</div>

<div class="block rueckwaerts">
<h2>Rückwärts <span class="hinweis">– SuS schreiben die Aufgabe</span></h2>
<pre id="rueck"></pre>
</div>

</div>

</div>

<div id="zettelseite"></div>
<div id="aufgabenseite"></div>

<script>
let vorwaerts = [];
let rueckwaerts = [];
let liste = [];

// Anteil, mit dem 10er- und 11er-Aufgaben sowie Aufgaben mit Faktor 10 gegenüber den anderen Reihen gezogen werden
const GEWICHT_10_11 = 0.2;

function add(){

    while(true){

        let a=Math.floor(Math.random()*liste.length);

        while(liste[a].length===0){
            a=Math.floor(Math.random()*liste.length);
        }

        // Reihennummer bestimmen
        let reihe = parseInt(liste[a][0].text.split(" × ")[1]);

        // 10er und 11er deutlich seltener (nur jede fünfte Ziehung wird behalten)
        if((reihe==10 || reihe==11) && Math.random()>=GEWICHT_10_11){
            continue;
        }

        let b=Math.floor(Math.random()*liste[a].length);

        // Aufgaben mit Faktor 10 (z. B. 10 × 8) ebenfalls deutlich seltener
        let faktor = parseInt(liste[a][b].text.split(" × ")[0]);
        if(faktor==10 && Math.random()>=GEWICHT_10_11){
            continue;
        }

        return liste[a][b];
    }

}
function erzeuge(){

    let start=parseInt(document.getElementById("von").value);
    let ziel=parseInt(document.getElementById("bis").value);

    if(start>ziel){
        alert("Die kleinste Reihe muss kleiner oder gleich der größten sein.");
        return;
    }

    liste=[];

    // Aufgaben erzeugen
    for(let i=start;i<=ziel;i++){
        liste.push([]);
    }

    for(let i=start;i<=ziel;i++){
        for(let j=2;j<=10;j++){
            liste[i-start].push({
                text:j+" × "+i,
                loesung:j*i
            });
        }
    }

    // ---------------- Vorwärts ----------------

    vorwaerts=[];

    while(vorwaerts.length<10){

        let neu=add();

        let vorhanden=vorwaerts.some(a =>
            a.text===neu.text
        );

        if(!vorhanden){
            vorwaerts.push(neu);
        }
    }

    let txt="";

    txt="";

let nr=1;

for(let a of vorwaerts){
    txt+=nr+". "+a.text+" = "+a.loesung+"\n";
    nr++;
}

    document.getElementById("vor").textContent=txt;

    // ---------------- Rückwärts ----------------

    rueckwaerts=[];

    while(rueckwaerts.length<10){

        let neu=add();

        let vorhanden=rueckwaerts.some(a =>
            a.loesung===neu.loesung
        );

        if(!vorhanden){

            let alle=[];

            for(let reihe of liste){
                for(let aufgabe of reihe){

                    if(aufgabe.loesung==neu.loesung){
                        alle.push(aufgabe.text);
                    }

                }
            }

            rueckwaerts.push({
                loesung:neu.loesung,
                text:alle.join(" oder ")
            });

        }

    }

    txt="";

nr=1;

for(let a of rueckwaerts){
    txt+=nr+". "+a.loesung+" = "+a.text+"\n";
    nr++;
}

    document.getElementById("rueck").textContent=txt;

}


// ---------- Kopieren ----------

function gesamterText(){

    return "Einmaleins\n\n"+
           "Vorwärts\n\n"+
           document.getElementById("vor").textContent+
           "\n\nRückwärts\n\n"+
           document.getElementById("rueck").textContent;

}

function kopieren(){

    navigator.clipboard.writeText(gesamterText());

    alert("In die Zwischenablage kopiert.");

}


// ---------- Teilen ----------

function teile(){

    let text=gesamterText();

    if(navigator.share){

        navigator.share({
            title:"Einmaleins",
            text:text
        });

    }else{

        let blob=new Blob([text],{type:"text/plain"});

        let a=document.createElement("a");

        a.href=URL.createObjectURL(blob);

        a.download="einmaleins.txt";

        a.click();

    }

}

// ---------- Aufgaben drucken ----------
// druckt denselben Inhalt wie beim Teilen, ohne Knöpfe und Farben

function aufgabenDrucken(){

    if(document.getElementById("vor").textContent===""){
        alert("Bitte zuerst Aufgaben erzeugen.");
        return;
    }

    let seite=document.getElementById("aufgabenseite");

    seite.innerHTML="<h1>Einmaleins</h1><h2>Vorwärts</h2><pre></pre><h2>Rückwärts</h2><pre></pre>";

    let bloecke=seite.querySelectorAll("pre");
    bloecke[0].textContent=document.getElementById("vor").textContent;
    bloecke[1].textContent=document.getElementById("rueck").textContent;

    document.body.classList.add("aufgaben-druck");

    window.print();

}

// ---------- Abfragezettel ----------
// 6 leere Zettel (10,5 × 9,9 cm) auf einer A4-Seite:
// links 10 Zeilen für die Ergebnisse (vorwärts), rechts 10 Zeilen für die Aufgaben (rückwärts)

function zettelSpalte(titel){

    let html="<div class='zettel-spalte'><h3>"+titel+"</h3>";

    for(let i=1;i<=10;i++){
        html+="<div class='zeile'><span>"+i+".</span><div></div></div>";
    }

    return html+"</div>";

}

function zettelDrucken(){

    let seite=document.getElementById("zettelseite");

    if(seite.children.length===0){

        let zettel=
            "<div class='zettel'>"+
                "<div class='zettel-kopf'>"+
                    "Name:<div class='feld' style='width:47mm'></div>"+
                    "<span style='margin-left:auto'>Fehler:</span><div class='feld' style='width:7mm'></div>/ 20"+
                "</div>"+
                "<div class='zettel-spalten'>"+
                    zettelSpalte("Vorwärts")+
                    zettelSpalte("Rückwärts")+
                "</div>"+
            "</div>";

        seite.innerHTML=zettel.repeat(6);

    }

    document.body.classList.add("zettel-druck");

    window.print();

}

window.addEventListener("afterprint",()=>{
    document.body.classList.remove("zettel-druck","aufgaben-druck");
});

</script>

</body>
</html>
