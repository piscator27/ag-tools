<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Würfelsimulation</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #ccc;
      margin-bottom: 2rem;
    }

    /* Steuerung */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .btn-count {
      background: #1a1a1a;
      color: #ccc;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 0.5rem 1.4rem;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .btn-count:hover {
      background: #2a2a2a;
      border-color: #888;
    }

    .btn-count.active {
      background: #222;
      border-color: #fff;
      color: #fff;
    }

    /* Würfelfläche */
    .dice-area {
      display: flex;
      gap: 3rem;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      margin-bottom: 3rem;
    }

    /* Einzelner Würfel */
    .die {
      width: 160px;
      height: 160px;
      background: #fff;
      border-radius: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 18px;
      gap: 6px;
      box-shadow: 0 0 40px rgba(255,255,255,0.12);
      transition: transform 0.08s;
    }

    .die.rolling {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%   { transform: rotate(0deg)   scale(1); }
      15%  { transform: rotate(-12deg) scale(1.05); }
      35%  { transform: rotate(14deg)  scale(1.05); }
      55%  { transform: rotate(-10deg) scale(1.03); }
      75%  { transform: rotate(8deg)   scale(1.03); }
      90%  { transform: rotate(-4deg)  scale(1.01); }
      100% { transform: rotate(0deg)   scale(1); }
    }

    .pip-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pip {
      width: 22px;
      height: 22px;
      background: #111;
      border-radius: 50%;
    }

    /* Würfel-Augen-Layout via Grid-Position */
    /* Positionen: 1=oben-links, 2=oben-mitte, 3=oben-rechts,
                   4=mitte-links, 5=mitte-mitte, 6=mitte-rechts,
                   7=unten-links, 8=unten-mitte, 9=unten-rechts */

    /* Würfel-Button */
    .btn-roll {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 0.85rem 3rem;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255,255,255,0.15);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .btn-roll:hover {
      background: #e8e8e8;
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(255,255,255,0.25);
    }

    .btn-roll:active {
      transform: scale(0.97);
    }

    /* Summenanzeige */
    .sum-display {
      margin-top: 2rem;
      font-size: 2.2rem;
      font-weight: 300;
      color: #aaa;
      letter-spacing: 0.1em;
      min-height: 2.8rem;
    }

    .sum-display span {
      color: #fff;
      font-weight: 790;
    }

    /* Logo */
    .logo {
      position: fixed;
      bottom: 16px;
      right: 22px;
      font-size: 1.5rem;
      color: #444;
      
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* Tastaturhinweis */
    .hint {
      position: fixed;
      bottom: 16px;
      left: 22px;
      font-size: 0.82rem;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Würfelsimulation</h1>

  <div class="controls">
    <button class="btn-count active" data-count="1" onclick="setCount(1)">1 Würfel</button>
    <button class="btn-count"        data-count="2" onclick="setCount(2)">2 Würfel</button>
    <button class="btn-count"        data-count="3" onclick="setCount(3)">3 Würfel</button>
  </div>

  <div class="dice-area" id="diceArea"></div>

  <button class="btn-roll" id="rollBtn" onclick="rollDice()">Würfeln</button>

  <div class="sum-display" id="sumDisplay"></div>

  <div class="logo">Fi</div>
  <div class="hint">Leertaste = Würfeln</div>

<script>
  // ── Pip-Positionen je Augenzahl ──────────────────────────────────────────
  // Zellen 1–9 im 3×3-Grid (Zeile × Spalte):
  //  1 2 3
  //  4 5 6
  //  7 8 9
  
  
  const PIP_MAP = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  let dieCount = 1;
  let rolling  = false;

  // ── Würfelanzahl setzen ───────────────────────────────────────────────────
  function setCount(n) {
    dieCount = n;
    document.querySelectorAll('.btn-count').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.count) === n);
    });
    renderDice([]);   // leere Würfel anzeigen
    document.getElementById('sumDisplay').innerHTML = '';
  }

  // ── Würfel rendern ────────────────────────────────────────────────────────
  function renderDice(values, animate) {
    const area = document.getElementById('diceArea');
    area.innerHTML = '';

    for (let i = 0; i < dieCount; i++) {
      const die = document.createElement('div');
      die.className = 'die' + (animate ? ' rolling' : '');

      // 9 Zellen erzeugen
      for (let cell = 1; cell <= 9; cell++) {
        const cellDiv = document.createElement('div');
        cellDiv.className = 'pip-cell';

        if (values[i] !== undefined && PIP_MAP[values[i]].includes(cell)) {
          const pip = document.createElement('div');
          pip.className = 'pip';
          cellDiv.appendChild(pip);
        }
        die.appendChild(cellDiv);
      }
      area.appendChild(die);
    }
  }

  // ── Würfeln ───────────────────────────────────────────────────────────────
  function rollDice() {
    if (rolling) return;
    rolling = true;

    document.getElementById('sumDisplay').innerHTML = '';
    document.getElementById('rollBtn').disabled = true;

    // Kurze Schüttel-Animation mit Zufallswerten
    let ticks = 0;
    const interval = setInterval(() => {
      const fakeVals = Array.from({length: dieCount}, () => randDie());
      renderDice(fakeVals, true);
      ticks++;
      if (ticks >= 7) {
        clearInterval(interval);
        finalRoll();
      }
    }, 75);
  }
  function playClick() {
    
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = 700;

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);

    osc.start();
    osc.stop(ctx.currentTime + 0.05);
}

  function finalRoll() {
    
    const values = Array.from({length: dieCount}, () => randDie());
    renderDice(values, false);
    playClick();

    const sum = values.reduce((a, b) => a + b, 0);
    const sumDiv = document.getElementById('sumDisplay');

    if (dieCount > 1) {
      const parts = values.join(' + ');
      sumDiv.innerHTML = `${parts} = <span>${sum}</span>`;
    } else {
      sumDiv.innerHTML = '';
    }

    document.getElementById('rollBtn').disabled = false;
    rolling = false;
  }

  function randDie() {
    return Math.floor(Math.random() * 6) + 1;
  }

  // ── Tastatursteuerung ─────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      rollDice();
    }
    if (e.key === '1') setCount(1);
    if (e.key === '2') setCount(2);
    if (e.key === '3') setCount(3);
  });

  // ── Initialisierung ───────────────────────────────────────────────────────
  renderDice([]);
</script>
</body>
</html>
