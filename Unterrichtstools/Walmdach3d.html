<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Walmdach – Abituraufgabe in 3D</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .app { display: flex; width: 100vw; height: 100vh; background: #000; }

  .canvas-area {
    position: relative;
    width: 68%;
    height: 100%;
    background: #000;
    border-right: 2px solid #222;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;
    cursor: move;
  }

  .headline {
    position: absolute;
    left: 24px;
    top: 18px;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    pointer-events: none;
  }

  .info {
    position: absolute;
    left: 24px;
    bottom: 18px;
    color: #888;
    font-size: 17px;
    line-height: 1.5;
    pointer-events: none;
  }

  .fi {
    position: absolute;
    right: 22px;
    bottom: 16px;
    color: #555;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 1px;
    user-select: none;
    pointer-events: none;
  }

  .panel {
    width: 32%;
    height: 100%;
    padding: 14px 22px 30px 22px;
    background: #050505;
    overflow-y: auto;
    font-size: 19px;
    line-height: 1.35;
  }

  h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; }

  h2 {
    margin: 16px 0 6px 0;
    font-size: 20px;
    color: #ddd;
    border-bottom: 1px solid #333;
    padding-bottom: 3px;
  }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

  .tabs button {
    flex: 1 1 30%;
    font-size: 16px;
    padding: 7px 4px;
    background: #111;
    color: #bbb;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
  }

  .tabs button.active { background: #fff; color: #000; border-color: #fff; font-weight: bold; }

  button {
    font-size: 16px;
    padding: 5px 9px;
    background: #151515;
    color: #ddd;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover { background: #222; color: #fff; }

  .button-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }

  .green  { color: #39d353; }
  .orange { color: #ff9f1c; }
  .blue   { color: #58b9ff; }
  .pink   { color: #ff5d8f; }
  .yellow { color: #ffe066; }
  .dim    { color: #888; }

  .eqbox {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-left: 3px solid #444;
    border-radius: 4px;
    padding: 8px 11px;
    margin: 7px 0;
  }

  .eqbox.hi { border-left-color: #ff9f1c; }
  .eqbox .label { font-size: 15px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .eqbox .eq { font-size: 21px; margin-top: 3px; }

  .formula { font-size: 21px; margin: 6px 0; }
  .result { color: #fff; font-weight: bold; }
  .big { font-size: 30px; font-weight: bold; }
  .note { font-size: 16px; color: #999; margin-top: 6px; line-height: 1.4; }

  .options { font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; }
  .options label { white-space: nowrap; cursor: pointer; }

  table.werte { width: 100%; border-collapse: collapse; font-size: 18px; margin-top: 4px; }
  table.werte td { padding: 3px 2px; border-bottom: 1px dotted #222; }
  table.werte td.r { text-align: right; color: #fff; font-weight: bold; }

  .hidden { display: none; }

  @media (max-height: 760px) {
    .panel { font-size: 17px; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; margin-top: 11px; }
    .formula { font-size: 19px; }
    .eqbox .eq { font-size: 18px; }
    .big { font-size: 25px; }
    .info { font-size: 15px; }
    table.werte { font-size: 16px; }
  }
</style>
</head>

<body>
<div class="app">
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="headline" id="headline">Walmdach</div>
    <div class="info">Ziehen dreht die Ansicht &middot; Mausrad zoomt</div>
    <div class="fi">Fi</div>
  </div>

  <div class="panel">
    <h1>Walmdach</h1>

    <div class="tabs" id="tabs">
      <button data-mode="haus">Haus</button>
      <button data-mode="c">c) Neigung</button>
      <button data-mode="d">d) 60&deg;/120&deg;</button>
      <button data-mode="e">e) senkrecht</button>
      <button data-mode="f">f) Schornstein</button>
      <button data-mode="g">g) Sonne</button>
      <button data-mode="h">h) Grat</button>
    </div>

    <div id="text"></div>

    <h2>Anzeigen</h2>
    <div class="options">
      <label><input type="checkbox" id="cbNormalen" /> Normalenvektoren</label>
      <label><input type="checkbox" id="cbSonne" /> Sonnenstrahlen</label>
      <label><input type="checkbox" id="cbSchornstein" /> Schornstein</label>
      <label><input type="checkbox" id="cbGrat" /> Grat AP</label>
      <label><input type="checkbox" id="cbWaende" checked /> W&auml;nde</label>
      <label><input type="checkbox" id="cbGitter" checked /> Boden</label>
    </div>

    <div class="button-row">
      <button id="btnReset">Ansicht zur&uuml;ck</button>
      <button id="btnVorn">von vorn</button>
      <button id="btnOben">von oben</button>
      <button id="btnSeite">von der Seite</button>
    </div>

    <h2>Punkte</h2>
    <table class="werte">
      <tr><td>A</td><td class="r">(0 | 0 | 4)</td><td>B</td><td class="r">(10 | 0 | 4)</td></tr>
      <tr><td>C</td><td class="r">(10 | 6 | 4)</td><td>D</td><td class="r">(0 | 6 | 4)</td></tr>
      <tr><td>P</td><td class="r">(3 | 3 | 7)</td><td>Q</td><td class="r">(7 | 3 | 7)</td></tr>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const colors = {
    grid: "#1a1a1a",
    axis: "#ffffff",
    labels: "#cccccc",
    wall: "#202020",
    wallEdge: "#4a4a4a",
    E1: "#ff9f1c",
    E2: "#58b9ff",
    E3: "#39d353",
    E4: "#7a5cff",
    sun: "#ffe066",
    grat: "#ff5d8f",
    chim: "#dddddd"
  };

  // ------------------------------------------------------------- Vektormathematik

  function v(x, y, z) { return { x: x, y: y, z: z }; }
  function add(a, b) { return v(a.x + b.x, a.y + b.y, a.z + b.z); }
  function sub(a, b) { return v(a.x - b.x, a.y - b.y, a.z - b.z); }
  function mul(a, f) { return v(a.x * f, a.y * f, a.z * f); }
  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { const l = len(a); return l < 1e-9 ? v(0, 0, 0) : mul(a, 1 / l); }
  function cross(a, b) {
    return v(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  }
  function toRad(d) { return d * Math.PI / 180; }
  function deg(r) { return r * 180 / Math.PI; }

  // Winkel zwischen zwei Ebenen bzw. zwei Geraden: mit Betrag, also spitz.
  function winkelSpitz(a, b) {
    let c = Math.abs(dot(a, b)) / (len(a) * len(b));
    c = Math.min(1, Math.max(0, c));
    return deg(Math.acos(c));
  }

  // Winkel zwischen Gerade und Ebene: Sinus, ebenfalls mit Betrag.
  function winkelGeradeEbene(u, n) {
    let s = Math.abs(dot(u, n)) / (len(u) * len(n));
    s = Math.min(1, Math.max(0, s));
    return deg(Math.asin(s));
  }

  function fmt(x, d) {
    if (d === undefined) d = 1;
    if (Math.abs(x) < 1e-9) x = 0;
    return Number(x).toFixed(d).replace(".", ",").replace("-", "−");
  }

  // ------------------------------------------------------------- Modell

  const A = v(0, 0, 4), B = v(10, 0, 4), C = v(10, 6, 4), D = v(0, 6, 4);
  const P = v(3, 3, 7), Q = v(7, 3, 7);
  const A0 = v(0, 0, 0), B0 = v(10, 0, 0), C0 = v(10, 6, 0), D0 = v(0, 6, 0);

  const nBoden = v(0, 0, 1);
  const sSonne = v(2, -5, -7);

  const dach = [
    { id: "E1", name: "E<sub>1</sub> vorn",   punkte: [A, B, Q, P], n: v(0, 1, -1), out: v(0, -1, 1), farbe: colors.E1, gl: "x₂ − x₃ = −4" },
    { id: "E2", name: "E<sub>2</sub> rechts", punkte: [B, C, Q],    n: v(1, 0, 1),  out: v(1, 0, 1),  farbe: colors.E2, gl: "x₁ + x₃ = 14" },
    { id: "E3", name: "E<sub>3</sub> hinten", punkte: [C, D, P, Q], n: v(0, 1, 1),  out: v(0, 1, 1),  farbe: colors.E3, gl: "x₂ + x₃ = 10" },
    { id: "E4", name: "E<sub>4</sub> links",  punkte: [A, P, D],    n: v(1, 0, -1), out: v(-1, 0, 1), farbe: colors.E4, gl: "x₁ − x₃ = −4" }
  ];

  const waende = [
    [A0, B0, B, A], [B0, C0, C, B], [C0, D0, D, C], [D0, A0, A, D]
  ];

  const beschriftung = [
    { p: A, t: "A" }, { p: B, t: "B" }, { p: C, t: "C" },
    { p: D, t: "D" }, { p: P, t: "P" }, { p: Q, t: "Q" }
  ];

  const R = v(6, 1, 0);                 // Fusspunkt des Schornsteins
  const SDurch = v(6, 1, 5);            // Durchstosspunkt (1 - t = -4)
  const SKopf = v(6, 1, 5.8);

  const center = v(5, 3, 3);            // Blickmittelpunkt

  // ------------------------------------------------------------- Kamera

  const START_AZ = -62, START_EL = 24;
  let azimuth = START_AZ, elevation = START_EL;
  let width = 0, height = 0, scale = 40, zoom = 0.88;
  let origin = { x: 0, y: 0 };
  let camera = null;

  function cameraBasis() {
    const a = toRad(azimuth), e = toRad(elevation);
    const forward = v(Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e));
    const right = v(-Math.sin(a), Math.cos(a), 0);
    const up = cross(forward, right);
    return { forward: forward, right: right, up: up };
  }

  function toScreen(p) {
    const q = sub(p, center);
    return {
      x: origin.x + dot(q, camera.right) * scale,
      y: origin.y - dot(q, camera.up) * scale
    };
  }

  function tiefe(p) { return dot(sub(p, center), camera.forward); }

  function baseScale() { return Math.max(12, Math.min(60, Math.min(width, height) / 16)); }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    scale = baseScale() * zoom;
    origin = { x: width * 0.5, y: height * 0.55 };
    draw();
  }

  // ------------------------------------------------------------- Zeichenhilfen

  function linie(a, b, farbe, breite, gestrichelt) {
    const s1 = toScreen(a), s2 = toScreen(b);
    ctx.save();
    ctx.strokeStyle = farbe;
    ctx.lineWidth = breite || 1.5;
    if (gestrichelt) ctx.setLineDash(gestrichelt);
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y);
    ctx.lineTo(s2.x, s2.y);
    ctx.stroke();
    ctx.restore();
  }

  function pfeil(von, nach, farbe, breite) {
    const s1 = toScreen(von), s2 = toScreen(nach);
    const dx = s2.x - s1.x, dy = s2.y - s1.y;
    const l = Math.hypot(dx, dy);
    ctx.save();
    ctx.strokeStyle = farbe;
    ctx.fillStyle = farbe;
    ctx.lineWidth = breite || 2.4;
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y);
    ctx.lineTo(s2.x, s2.y);
    ctx.stroke();
    if (l > 6) {
      const ux = dx / l, uy = dy / l;
      const k = Math.min(13, l * 0.3);
      ctx.beginPath();
      ctx.moveTo(s2.x, s2.y);
      ctx.lineTo(s2.x - k * ux + k * 0.42 * uy, s2.y - k * uy - k * 0.42 * ux);
      ctx.lineTo(s2.x - k * ux - k * 0.42 * uy, s2.y - k * uy + k * 0.42 * ux);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function flaeche(punkte, fuellung, rand, breite) {
    ctx.save();
    ctx.beginPath();
    punkte.forEach(function (p, i) {
      const s = toScreen(p);
      if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
    });
    ctx.closePath();
    if (fuellung) { ctx.fillStyle = fuellung; ctx.fill(); }
    if (rand) { ctx.strokeStyle = rand; ctx.lineWidth = breite || 1.5; ctx.stroke(); }
    ctx.restore();
  }

  function text(p, s, farbe, dx, dy, groesse) {
    const q = toScreen(p);
    ctx.save();
    ctx.font = (groesse || 17) + "px Arial, Helvetica, sans-serif";
    ctx.fillStyle = farbe || colors.labels;
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3.5;
    ctx.lineJoin = "round";
    ctx.strokeText(s, q.x + (dx || 0), q.y + (dy || 0));
    ctx.fillText(s, q.x + (dx || 0), q.y + (dy || 0));
    ctx.restore();
  }

  function punkt(p, farbe, r) {
    const s = toScreen(p);
    ctx.save();
    ctx.fillStyle = farbe;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r || 4, 0, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
  }

  function mischen(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function schwerpunkt(pts) {
    let s = v(0, 0, 0);
    pts.forEach(function (p) { s = add(s, p); });
    return mul(s, 1 / pts.length);
  }

  // ------------------------------------------------------------- Zustand

  let mode = "haus";
  const zeige = {
    normalen: false, sonne: false, schornstein: false,
    grat: false, waende: true, gitter: true
  };
  let hervor = [];          // hervorgehobene Dachflaechen

  // ------------------------------------------------------------- Zeichnen

  function draw() {
    camera = cameraBasis();
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    if (zeige.gitter) zeichneBoden();

    // Alle Flaechen einsammeln und nach Tiefe sortieren (Maler-Algorithmus).
    const flaechen = [];

    if (zeige.waende) {
      waende.forEach(function (w) {
        flaechen.push({ pts: w, fill: colors.wall, rand: colors.wallEdge, breite: 1.4 });
      });
      flaechen.push({ pts: [A0, B0, C0, D0], fill: "#151515", rand: colors.wallEdge, breite: 1.2 });
    }

    dach.forEach(function (f) {
      const aktiv = hervor.length === 0 || hervor.indexOf(f.id) >= 0;
      flaechen.push({
        pts: f.punkte,
        fill: mischen(f.farbe, aktiv ? 0.60 : 0.12),
        rand: aktiv ? f.farbe : mischen(f.farbe, 0.35),
        breite: aktiv ? 2.2 : 1.2,
        flaeche: f
      });
    });

    flaechen.sort(function (a, b) {
      return tiefe(schwerpunkt(a.pts)) - tiefe(schwerpunkt(b.pts));
    });

    flaechen.forEach(function (f) {
      flaeche(f.pts, f.fill, f.rand, f.breite);
    });

    // Dachkanten immer sichtbar nachziehen
    [[A, P], [B, Q], [C, Q], [D, P], [P, Q], [A, B], [B, C], [C, D], [D, A]].forEach(function (k) {
      linie(k[0], k[1], "#cfcfcf", 1.6);
    });

    if (zeige.grat) {
      linie(A, P, colors.grat, 4);
      const m = mul(add(A, P), 0.5);
      text(m, "Grat AP", colors.grat, 8, -8);
    }

    if (zeige.normalen) zeichneNormalen();
    if (zeige.sonne) zeichneSonne();
    if (zeige.schornstein) zeichneSchornstein();

    zeichneAchsen();

    // Beschriftung zuletzt
    beschriftung.forEach(function (b) {
      punkt(b.p, "#ffffff", 3.6);
      text(b.p, b.t, "#ffffff", 9, -7, 19);
    });

    if (hervor.length > 0) {
      dach.forEach(function (f) {
        if (hervor.indexOf(f.id) < 0) return;
        text(schwerpunkt(f.punkte), f.id, f.farbe, -14, 30, 20);
      });
    }
  }

  function zeichneBoden() {
    ctx.save();
    for (let x = -2; x <= 14; x += 2) linie(v(x, -4, 0), v(x, 10, 0), colors.grid, 1);
    for (let y = -4; y <= 10; y += 2) linie(v(-2, y, 0), v(14, y, 0), colors.grid, 1);
    ctx.restore();
  }

  function zeichneAchsen() {
    pfeil(v(0, 0, 0), v(14, 0, 0), "#777", 1.6);
    pfeil(v(0, 0, 0), v(0, 10, 0), "#777", 1.6);
    pfeil(v(0, 0, 0), v(0, 0, 10), "#777", 1.6);
    text(v(14, 0, 0), "x₁", colors.labels, 8, 4);
    text(v(0, 10, 0), "x₂", colors.labels, 8, 4);
    text(v(0, 0, 10), "x₃", colors.labels, 6, -6);
  }

  function zeichneNormalen() {
    dach.forEach(function (f) {
      if (hervor.length > 0 && hervor.indexOf(f.id) < 0) return;
      const fuss = schwerpunkt(f.punkte);
      const spitze = add(fuss, mul(norm(f.out), 3.2));
      pfeil(fuss, spitze, f.farbe, 2.6);
      text(spitze, "n(" + f.id + ")", f.farbe, 7, -5, 16);
    });
    if (mode === "c" || mode === "h") {
      const fuss = v(12, 8, 0);
      pfeil(fuss, add(fuss, v(0, 0, 3.2)), "#ffffff", 2.4);
      text(add(fuss, v(0, 0, 3.2)), "n(Boden)", "#ffffff", 7, -5, 16);
    }
  }

  function zeichneSonne() {
    const s = norm(sSonne);
    // Strahlen, die auf den drei Dachflaechen ankommen
    const ziele = [
      { f: dach[0], pts: [v(3, 1, 5), v(6, 1.5, 5.5), v(8.2, 0.8, 4.8)] },
      { f: dach[1], pts: [v(9, 3, 5), v(8.6, 1.8, 5.4)] },
      { f: dach[2], pts: [v(3, 4.5, 5.5), v(6.5, 5, 5), v(5, 4, 6)] }
    ];
    ziele.forEach(function (z) {
      if (hervor.length > 0 && hervor.indexOf(z.f.id) < 0) return;
      z.pts.forEach(function (p) {
        pfeil(sub(p, mul(s, 4.5)), p, colors.sun, 1.8);
      });
    });
    const start = sub(v(6, 5, 6), mul(s, 4.5));
    text(start, "s", colors.sun, 12, 0, 22);
  }

  function zeichneSchornstein() {
    linie(R, SDurch, colors.chim, 2, [5, 4]);
    linie(SDurch, SKopf, colors.chim, 7);
    punkt(R, colors.chim, 4);
    punkt(SDurch, "#ff5d8f", 5.5);
    text(R, "R(6 | 1 | 0)", colors.chim, 9, 16, 16);
    text(SDurch, "S(6 | 1 | 5)", "#ff5d8f", 10, -8, 17);
  }

  // ------------------------------------------------------------- Panel

  const nE1 = dach[0].n, nE2 = dach[1].n, nE3 = dach[2].n;
  const uGrat = sub(P, A);

  const werte = {
    neigung1: winkelSpitz(nE1, nBoden),
    e1e2: winkelSpitz(nE1, nE2),
    e1e3: winkelSpitz(nE1, nE3),
    grat: winkelGeradeEbene(uGrat, nBoden),
    sonneBoden: winkelGeradeEbene(sSonne, nBoden),
    sE1: winkelGeradeEbene(sSonne, nE1),
    sE2: winkelGeradeEbene(sSonne, nE2),
    sE3: winkelGeradeEbene(sSonne, nE3)
  };

  const texte = {
    haus: function () {
      return '<div class="eqbox"><div class="label">Der Bauk&ouml;rper</div>'
        + '<div class="eq">Traufe bei x<sub>3</sub> = 4, First bei x<sub>3</sub> = 7</div></div>'
        + '<div class="formula">|PQ| = <span class="result">4 m</span></div>'
        + '<div class="formula">|AP| = &radic;27 &asymp; <span class="result">' + fmt(len(uGrat), 2) + ' m</span></div>'
        + '<div class="note">Alle vier Dachfl&auml;chen sind gleich steil &ndash; das ist die Bedingung daf&uuml;r, '
        + 'dass ein Walmdach handwerklich aufgeht. Rechnerisch sieht man es an den Normalenvektoren: '
        + 'jeder hat den Betrag &radic;2.</div>';
    },
    c: function () {
      return '<div class="eqbox hi"><div class="label">c) Neigung gegen den Boden</div>'
        + '<div class="eq">n<sub>1</sub> = (0 | 1 | &minus;1), n<sub>Boden</sub> = (0 | 0 | 1)</div></div>'
        + '<div class="formula">cos &alpha; = |&minus;1| / (&radic;2 &middot; 1) = 0,7071</div>'
        + '<div class="big orange">&alpha; = ' + fmt(werte.neigung1) + '&deg;</div>'
        + '<div class="note">Die rechte Seite der Ebenengleichung (&minus;4) taucht nicht auf: '
        + 'Sie verschiebt die Ebene parallel und &auml;ndert die Neigung nicht.</div>';
    },
    d: function () {
      return '<div class="eqbox hi"><div class="label">d) Winkel der beiden Dachfl&auml;chen</div>'
        + '<div class="eq">n<sub>1</sub> &middot; n<sub>2</sub> = &minus;1, |n<sub>1</sub>| = |n<sub>2</sub>| = &radic;2</div></div>'
        + '<div class="formula">cos &alpha; = 1/2</div>'
        + '<div class="big orange">&alpha; = ' + fmt(werte.e1e2) + '&deg;</div>'
        + '<div class="formula dim">am Dach sichtbar: 180&deg; &minus; ' + fmt(werte.e1e2) + '&deg; = '
        + fmt(180 - werte.e1e2) + '&deg;</div>'
        + '<div class="note">Zwei Ebenen erzeugen beim Schneiden immer beide Winkel gleichzeitig. '
        + 'Die Betragsstriche w&auml;hlen den spitzen aus &ndash; sonst h&auml;nge das Ergebnis davon ab, '
        + 'wer die Ebenengleichung wie herum aufgeschrieben hat.</div>';
    },
    e: function () {
      return '<div class="eqbox hi"><div class="label">e) vorn und hinten</div>'
        + '<div class="eq">n<sub>1</sub> &middot; n<sub>3</sub> = 0 + 1 &minus; 1 = 0</div></div>'
        + '<div class="big green">&alpha; = ' + fmt(werte.e1e3) + '&deg;</div>'
        + '<div class="note">45&deg; + 45&deg; = 90&deg;: Beide Fl&auml;chen sind gleich steil, '
        + 'aber nach entgegengesetzten Seiten geneigt.</div>';
    },
    f: function () {
      return '<div class="eqbox hi"><div class="label">f) Schornstein</div>'
        + '<div class="eq">x = (6 | 1 | 0) + t &middot; (0 | 0 | 1)</div></div>'
        + '<div class="formula">einsetzen in x<sub>2</sub> &minus; x<sub>3</sub> = &minus;4:</div>'
        + '<div class="formula">1 &minus; t = &minus;4 &rArr; t = 5</div>'
        + '<div class="big pink">S(6 | 1 | 5)</div>'
        + '<div class="note">Der Parameter t ist hier die H&ouml;he &uuml;ber dem Boden, weil der '
        + 'Richtungsvektor (0 | 0 | 1) genau einen Meter lang ist und der St&uuml;tzpunkt auf dem Boden liegt. '
        + 'Mit 0,8 m &Uuml;berstand: 5,8 m.</div>';
    },
    g: function () {
      return '<div class="eqbox hi"><div class="label">g) Winkel Sonnenstrahl &ndash; Dachfl&auml;che</div>'
        + '<div class="eq">sin &alpha; = |s &middot; n| / (|s| &middot; |n|)</div></div>'
        + '<table class="werte">'
        + '<tr><td class="orange">E<sub>1</sub> vorn</td><td class="r">' + fmt(werte.sE1) + '&deg;</td></tr>'
        + '<tr><td class="blue">E<sub>2</sub> rechts</td><td class="r">' + fmt(werte.sE2) + '&deg;</td></tr>'
        + '<tr><td class="green">E<sub>3</sub> hinten</td><td class="r">' + fmt(werte.sE3) + '&deg;</td></tr>'
        + '<tr><td class="dim">Sonne &uuml;ber dem Boden</td><td class="r">' + fmt(werte.sonneBoden) + '&deg;</td></tr>'
        + '</table>'
        + '<div class="note">Die Module geh&ouml;ren auf E<sub>3</sub>. &ndash; Weil die Sonne mit '
        + fmt(werte.sonneBoden) + '&deg; h&ouml;her steht, als das Dach mit 45&deg; steil ist, liegt keine '
        + 'Dachfl&auml;che im Eigenschatten: alle bekommen Licht, nur unter sehr verschiedenen Winkeln.</div>';
    },
    h: function () {
      return '<div class="eqbox hi"><div class="label">h) Grat gegen den Boden</div>'
        + '<div class="eq">u = AP = (3 | 3 | 3), n = (0 | 0 | 1)</div></div>'
        + '<div class="formula">sin &alpha; = 3 / &radic;27 = 0,5774</div>'
        + '<div class="big pink">&alpha; = ' + fmt(werte.grat) + '&deg;</div>'
        + '<div class="formula dim">Dachfl&auml;che dagegen: ' + fmt(werte.neigung1) + '&deg;</div>'
        + '<div class="note">Der Grat ist flacher: Er &uuml;berwindet dieselben 3 m H&ouml;he, l&auml;uft '
        + 'dabei aber schr&auml;g &uuml;ber die Fl&auml;che &ndash; waagerecht &radic;18 &asymp; 4,24 m statt 3 m. '
        + 'Er liegt <b>in</b> der Ebene E<sub>1</sub>: u &middot; n<sub>1</sub> = 3 &minus; 3 = 0.</div>';
    }
  };

  const headlines = {
    haus: "Walmdach", c: "c) Wie steil ist das Dach?", d: "d) 60° oder 120°?",
    e: "e) vorn ⊥ hinten", f: "f) Wo tritt der Schornstein aus?",
    g: "g) Wohin mit den Modulen?", h: "h) Wie steil ist der Grat?"
  };

  function setMode(m) {
    mode = m;
    hervor = [];
    zeige.normalen = false;
    zeige.sonne = false;
    zeige.schornstein = false;
    zeige.grat = false;

    if (m === "c") { hervor = ["E1"]; zeige.normalen = true; }
    if (m === "d") { hervor = ["E1", "E2"]; zeige.normalen = true; }
    if (m === "e") { hervor = ["E1", "E3"]; zeige.normalen = true; }
    if (m === "f") { hervor = ["E1"]; zeige.schornstein = true; }
    if (m === "g") { zeige.sonne = true; zeige.normalen = true; }
    if (m === "h") { hervor = ["E1"]; zeige.grat = true; }

    document.getElementById("cbNormalen").checked = zeige.normalen;
    document.getElementById("cbSonne").checked = zeige.sonne;
    document.getElementById("cbSchornstein").checked = zeige.schornstein;
    document.getElementById("cbGrat").checked = zeige.grat;

    document.getElementById("text").innerHTML = texte[m]();
    document.getElementById("headline").textContent = headlines[m];

    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.classList.toggle("active", b.dataset.mode === m);
    });

    draw();
  }

  // ------------------------------------------------------------- Bedienung

  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  [["cbNormalen", "normalen"], ["cbSonne", "sonne"], ["cbSchornstein", "schornstein"],
   ["cbGrat", "grat"], ["cbWaende", "waende"], ["cbGitter", "gitter"]].forEach(function (paar) {
    document.getElementById(paar[0]).addEventListener("change", function (e) {
      zeige[paar[1]] = e.target.checked;
      draw();
    });
  });

  function setView(az, el) { azimuth = az; elevation = el; draw(); }
  document.getElementById("btnReset").addEventListener("click", function () { zoom = 0.88; scale = baseScale() * zoom; setView(START_AZ, START_EL); });
  document.getElementById("btnVorn").addEventListener("click", function () { setView(-90, 4); });
  document.getElementById("btnOben").addEventListener("click", function () { setView(-90, 86); });
  document.getElementById("btnSeite").addEventListener("click", function () { setView(0, 4); });

  let ziehen = false, letzte = { x: 0, y: 0 };

  canvas.addEventListener("pointerdown", function (e) {
    ziehen = true;
    letzte = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!ziehen) return;
    azimuth -= (e.clientX - letzte.x) * 0.4;
    elevation += (e.clientY - letzte.y) * 0.4;
    elevation = Math.max(-88, Math.min(88, elevation));
    letzte = { x: e.clientX, y: e.clientY };
    draw();
  });

  function ende(e) {
    ziehen = false;
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  }
  canvas.addEventListener("pointerup", ende);
  canvas.addEventListener("pointercancel", ende);

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoom *= e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoom = Math.max(0.3, Math.min(4, zoom));
    scale = baseScale() * zoom;
    draw();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    const map = { "1": "haus", "2": "c", "3": "d", "4": "e", "5": "f", "6": "g", "7": "h" };
    if (map[e.key]) setMode(map[e.key]);
  });

  window.addEventListener("resize", resize);

  resize();
  setMode("haus");
})();
</script>
</body>
</html>
