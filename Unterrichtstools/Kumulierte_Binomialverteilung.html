<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumulierte Binomialverteilung</title>
<style>
:root {
  --bg: #1a1a1a;
  --panel: #262626;
  --panel2: #303030;
  --text: #f2f2f2;
  --text-soft: #b5b5b5;
  --accent: #4da3ff;
  --hl: #4da3ff;
  --hl2: #2f78c8;
  --hl-pend: #22415f;
  --bar-off: #555;
  --grid: #3a3a3a;
  --ok: #4caf50;
  --warn: #ffb300;
  --bad: #ef5350;
  --logo: #888;
  --logo-opacity: 0.4;
  --font-base: 28px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#stage {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--font-base);
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding: 12px 16px 16px;
}
header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
h1 { font-size: 34px; margin: 0; font-weight: 700; }
.modes { display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 2px solid var(--panel2); }
.modes button {
  font: inherit; font-size: 28px; padding: 8px 20px; border: none; cursor: pointer;
  background: var(--panel); color: var(--text-soft); min-height: 56px;
}
.modes button + button { border-left: 2px solid var(--panel2); }
.modes button.active { background: var(--accent); color: #0d1b2a; font-weight: 700; }

main { display: grid; grid-template-columns: 1fr minmax(340px, 26%); gap: 16px; min-height: 0; }
#chartbox { background: var(--panel); border-radius: 14px; min-height: 0; position: relative; overflow: hidden; }
#chart { display: block; position: absolute; inset: 0; touch-action: manipulation; }
#chart text { fill: var(--text-soft); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#chart .hit { cursor: pointer; }

aside { background: var(--panel); border-radius: 14px; padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.ctl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ctl-head label { font-weight: 700; font-size: 32px; font-style: italic; font-family: "Times New Roman", serif; }
.num {
  font: inherit; font-size: 30px; width: 130px; text-align: right; padding: 2px 8px;
  background: var(--bg); color: var(--text); border: 2px solid var(--panel2); border-radius: 8px;
}
.num:focus { outline: 3px solid var(--accent); }
.ctl-slide { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.pm {
  font: inherit; font-size: 30px; width: 52px; height: 52px; flex: none; border-radius: 10px;
  border: none; background: var(--panel2); color: var(--text); cursor: pointer; line-height: 1;
}
.pm:active { background: var(--accent); color: #000; }
.pm.frac { width: auto; padding: 0 12px; font-size: 26px; height: 46px; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 48px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; background: var(--panel2); border-radius: 5px; }
input[type=range]::-moz-range-track { height: 10px; background: var(--panel2); border-radius: 5px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 38px; height: 38px; margin-top: -14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--text); }
input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: 3px solid var(--text); }
#row-k .ctl-head label, #row-a .ctl-head label { color: var(--hl); }

.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 8px; }
.btn {
  font: inherit; font-size: 24px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--panel2);
  background: var(--panel2); color: var(--text); cursor: pointer; min-height: 52px; flex: 1 1 auto;
}
.btn.play { background: var(--warn); color: #1a1a1a; border-color: var(--warn); font-weight: 700; flex-basis: 100%; }
.btn.tog[aria-pressed=false] { background: transparent; color: var(--text-soft); }
.btn.tog[aria-pressed=true]::before { content: "✓ "; }

#formula {
  background: var(--panel); border-radius: 14px; padding: 12px 22px; min-height: 160px;
  font-size: 30px; line-height: 1.5;
}
#formula .line { display: block; }
#formula .soft { color: var(--text-soft); font-size: 24px; }
#formula .hl { color: var(--hl); font-weight: 700; }
#formula .cur { color: var(--warn); font-weight: 700; }
#formula .dim { color: var(--text-soft); opacity: .6; }
#formula .big { font-size: 36px; }
.binom { display: inline-flex; align-items: center; }
.binom .br { font-size: 2.1em; font-weight: 200; line-height: 1; }
.binom .st { display: inline-flex; flex-direction: column; align-items: center; font-size: .8em; line-height: 1.1; }

#logo { position: fixed; right: 12px; bottom: 6px; font-size: 16px; color: var(--logo); opacity: var(--logo-opacity); pointer-events: none; }

</style>
</head>
<body>
<div id="stage">
<header>
  <h1>Kumulierte Binomialverteilung</h1>
  <div class="modes" id="modes">
    <button data-mode="le">P(X ≤ k)</button>
    <button data-mode="ge">P(X ≥ k)</button>
    <button data-mode="eq">P(X = k)</button>
    <button data-mode="iv">P(a ≤ X ≤ b)</button>
  </div>
</header>

<main>
  <div id="chartbox"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside>
    <div class="ctl" id="row-n">
      <div class="ctl-head"><label for="num-n">n</label><input class="num" id="num-n" inputmode="numeric"></div>
      <div class="ctl-slide"><button class="pm" data-key="n" data-d="-1">−</button><input type="range" id="rng-n" min="1" max="100" step="1"><button class="pm" data-key="n" data-d="1">+</button></div>
    </div>
    <div class="ctl" id="row-p">
      <div class="ctl-head"><label for="num-p">p</label><span style="display:flex;gap:8px;align-items:center"><button class="pm frac" id="btn-p16" title="p = 1/6 (Würfel)">1/6</button><input class="num" id="num-p" inputmode="text" title="Dezimalzahl (0,94) oder Bruch (1/6)"></span></div>
      <div class="ctl-slide"><button class="pm" data-key="p" data-d="-0.01">−</button><input type="range" id="rng-p" min="0" max="1" step="0.01"><button class="pm" data-key="p" data-d="0.01">+</button></div>
    </div>
    <div class="ctl" id="row-a">
      <div class="ctl-head"><label for="num-a">a</label><input class="num" id="num-a" inputmode="numeric"></div>
      <div class="ctl-slide"><button class="pm" data-key="a" data-d="-1">−</button><input type="range" id="rng-a" min="0" max="20" step="1"><button class="pm" data-key="a" data-d="1">+</button></div>
    </div>
    <div class="ctl" id="row-k">
      <div class="ctl-head"><label for="num-k" id="lbl-k">k</label><input class="num" id="num-k" inputmode="numeric"></div>
      <div class="ctl-slide"><button class="pm" data-key="k" data-d="-1">−</button><input type="range" id="rng-k" min="0" max="20" step="1"><button class="pm" data-key="k" data-d="1">+</button></div>
    </div>
    <div class="btns">
      <button class="btn play" id="btn-play">▶ Schritt für Schritt</button>
      <button class="btn" id="btn-step">+1 Summand</button>
      <button class="btn tog" id="tog-stack" aria-pressed="true">Summensäule</button>
      <button class="btn tog" id="tog-vals" aria-pressed="true">Werte</button>
      <button class="btn tog" id="tog-crop" aria-pressed="false">Ausschnitt</button>
    </div>
  </aside>
</main>

<section id="formula"></section>
</div>
<div id="logo">© Fi</div>

<script>
"use strict";
const S = { mode: "le", n: 20, p: 0.3, pFrac: null, k: 6, a: 3, stack: true, vals: true, crop: false, anim: null, timer: null };
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- Mathematik ---------- */
function pmf(n, p) {
  const lf = [0];
  for (let i = 1; i <= n; i++) lf[i] = lf[i - 1] + Math.log(i);
  const out = [];
  for (let i = 0; i <= n; i++) {
    if (p === 0) out.push(i === 0 ? 1 : 0);
    else if (p === 1) out.push(i === n ? 1 : 0);
    else out.push(Math.exp(lf[n] - lf[i] - lf[n - i] + i * Math.log(p) + (n - i) * Math.log(1 - p)));
  }
  return out;
}
function range() {
  if (S.mode === "le") return [0, S.k];
  if (S.mode === "ge") return [S.k, S.n];
  if (S.mode === "eq") return [S.k, S.k];
  return [S.a, S.k];
}
const fmt = x => x.toFixed(4).replace(".", ",");
const fmtP = x => String(parseFloat(x.toFixed(4))).replace(".", ",");
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

/* ---------- Einstellungen ---------- */
function setVal(key, v) {
  if (!isFinite(v)) { render(); return; }
  if (key === "n") { S.n = clamp(Math.round(v), 1, 200); S.k = Math.min(S.k, S.n); S.a = Math.min(S.a, S.n); }
  if (key === "p") { S.p = clamp(Math.round(v * 10000) / 10000, 0, 1); S.pFrac = null; }
  if (key === "k") { S.k = clamp(Math.round(v), 0, S.n); if (S.mode === "iv" && S.a > S.k) S.a = S.k; }
  if (key === "a") { S.a = clamp(Math.round(v), 0, S.n); if (S.a > S.k) S.k = S.a; }
  stopAnim(); render();
}
function setMode(m) {
  S.mode = m;
  if (m === "iv" && S.a > S.k) S.a = Math.max(0, S.k - 2);
  stopAnim(); render();
}

/* ---------- Animation ---------- */
function termCount() { const [lo, hi] = range(); return hi - lo + 1; }
function clearTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function stopAnim() { clearTimer(); S.anim = null; }
function advance() {
  if (!S.anim) S.anim = { shown: 0 };
  S.anim.shown++;
  if (S.anim.shown > termCount()) { stopAnim(); }
  render();
}
function togglePlay() {
  if (S.timer) { clearTimer(); render(); return; }
  if (!S.anim) S.anim = { shown: 0 };
  const dt = clamp(5000 / termCount(), 180, 1000);
  S.timer = setInterval(advance, dt);
  render();
}
function stepOnce() { clearTimer(); advance(); }

/* ---------- Zeichnen ---------- */
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function niceStep(max, target) {
  const raw = max / target, pow = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * pow >= raw) return m * pow;
  return 10 * pow;
}
function barState(i, lo, hi) {
  if (i < lo || i > hi) return "off";
  if (!S.anim) return "on";
  const j = i - lo;
  if (j < S.anim.shown - 1) return "on";
  if (j === S.anim.shown - 1) return "cur";
  return "pend";
}

function drawChart() {
  const svg = $("chart"), box = $("chartbox");
  const W = box.clientWidth, H = box.clientHeight;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  if (W < 50 || H < 50) return;

  const P = pmf(S.n, S.p);
  const [lo, hi] = range();
  const col = { off: css("--bar-off"), on: css("--hl"), cur: css("--warn"), pend: css("--hl-pend") };

  // sichtbarer Bereich
  let x0 = 0, x1 = S.n;
  if (S.crop) {
    const thr = 5e-4;
    x0 = P.findIndex(v => v >= thr); x1 = S.n - [...P].reverse().findIndex(v => v >= thr);
    if (x0 < 0) { x0 = 0; x1 = S.n; }
    x0 = Math.max(0, Math.min(x0, S.k, S.mode === "iv" ? S.a : S.k) - 1);
    x1 = Math.min(S.n, Math.max(x1, S.k) + 1);
  }
  const count = x1 - x0 + 1;

  const stackW = S.stack ? 130 : 0, stackGap = S.stack ? 110 : 0;
  const m = { l: 105, r: 30 + stackW + stackGap, t: 40, b: 72 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const slot = pw / count;
  const showVals = S.vals && count <= 26;
  const rotate = slot < 78;

  let ymax = Math.max(...P.slice(x0, x1 + 1));
  ymax *= showVals ? (rotate ? 1.32 : 1.14) : 1.06;
  if (ymax <= 0) ymax = 1;
  const yS = v => m.t + ph - (v / ymax) * ph;
  const xS = i => m.l + (i - x0) * slot;

  // Gitter + y-Achse
  const step = niceStep(ymax, 5);
  for (let v = 0; v <= ymax + 1e-12; v += step) {
    const y = yS(v);
    el("line", { x1: m.l, x2: m.l + pw, y1: y, y2: y, stroke: css("--grid"), "stroke-width": 1 }, svg);
    el("text", { x: m.l - 12, y: y + 8, "text-anchor": "end", "font-size": 22 }, svg, fmtP(v));
  }
  el("text", { x: 16, y: m.t - 14, "font-size": 22 }, svg, "P(X = i)");

  // Balken
  const bw = count > 60 ? slot * 0.94 : slot * 0.86;
  for (let i = x0; i <= x1; i++) {
    const st = barState(i, lo, hi);
    const x = xS(i) + (slot - bw) / 2, y = yS(P[i]);
    el("rect", { x, y, width: Math.max(bw, 1), height: m.t + ph - y, fill: col[st],
      stroke: st === "cur" ? css("--text") : "none", "stroke-width": 2 }, svg);
    if (showVals && P[i] >= 5e-5) {
      const tx = xS(i) + slot / 2, ty = y - 8;
      const t = el("text", { x: tx, y: ty, "font-size": 19,
        "text-anchor": rotate ? "start" : "middle",
        transform: rotate ? `rotate(-90 ${tx + 6} ${ty})` : "" }, svg, fmt(P[i]));
      t.style.fill = st === "off" || st === "pend" ? css("--text-soft") : (st === "cur" ? css("--warn") : css("--text"));
      if (rotate) t.setAttribute("x", tx + 6);
    }
  }
  // x-Achse
  el("line", { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, stroke: css("--text-soft"), "stroke-width": 2 }, svg);
  const lstep = [1, 2, 5, 10, 20, 25, 50].find(s => pw / count * s >= 34) || 50;
  for (let i = x0; i <= x1; i++) {
    const inR = i >= lo && i <= hi;
    const isK = i === S.k || (S.mode === "iv" && i === S.a);
    if (i % lstep !== 0 && !isK) continue;
    const near = j => j !== i && Math.abs(i - j) * slot < 34;
    if (!isK && (near(S.k) || (S.mode === "iv" && near(S.a)))) continue;
    const t = el("text", { x: xS(i) + slot / 2, y: m.t + ph + 32, "text-anchor": "middle", "font-size": isK ? 26 : 22 }, svg, i);
    if (isK) { t.style.fill = css("--hl"); t.style.fontWeight = "700"; }
    else if (inR) t.style.fill = css("--text");
  }
  el("text", { x: m.l + pw / 2, y: H - 8, "text-anchor": "middle", "font-size": 22 }, svg, "i  (Anzahl der Treffer)");

  // unsichtbare Klickflächen: Klick auf Balken setzt k
  for (let i = x0; i <= x1; i++) {
    const r = el("rect", { class: "hit", x: xS(i), y: m.t, width: slot, height: ph + 40, fill: "transparent" }, svg);
    r.addEventListener("click", () => {
      if (S.mode === "iv") { if (Math.abs(i - S.a) < Math.abs(i - S.k)) setVal("a", i); else setVal("k", i); }
      else setVal("k", i);
    });
  }

  // Summensäule
  if (S.stack) {
    const sx = W - 30 - stackW, sTop = m.t, sH = ph;
    const sy = v => sTop + sH - v * sH;
    for (const v of [0, 0.25, 0.5, 0.75, 1]) {
      el("line", { x1: sx - 8, x2: sx + stackW, y1: sy(v), y2: sy(v), stroke: css("--grid"), "stroke-width": 1 }, svg);
      el("text", { x: sx - 12, y: sy(v) + 8, "text-anchor": "end", "font-size": 20 }, svg, fmtP(v));
    }
    el("rect", { x: sx, y: sTop, width: stackW, height: sH, fill: "none", stroke: css("--text-soft"), "stroke-width": 2, "stroke-dasharray": "6 6" }, svg);
    let acc = 0;
    const shown = S.anim ? S.anim.shown : hi - lo + 1;
    for (let j = 0; j < shown && lo + j <= hi; j++) {
      const i = lo + j, h = P[i] * sH;
      const isCur = S.anim && j === shown - 1;
      el("rect", { x: sx, y: sy(acc) - h, width: stackW, height: h,
        fill: isCur ? col.cur : (i % 2 ? css("--hl2") : col.on) }, svg);
      if (h >= 26 && stackW >= 90) {
        const t = el("text", { x: sx + stackW / 2, y: sy(acc) - h / 2 + 7, "text-anchor": "middle", "font-size": 18 }, svg, "X=" + i);
        t.style.fill = "#0d1b2a"; t.style.fontWeight = "700";
      }
      acc += P[i];
    }
    const lbl = el("text", { x: sx + stackW / 2, y: Math.max(sy(acc) - 12, 26), "text-anchor": "middle", "font-size": 24 }, svg, "Σ " + fmt(acc));
    lbl.style.fill = S.anim ? css("--warn") : css("--hl"); lbl.style.fontWeight = "700";
    el("text", { x: sx + stackW / 2, y: m.t + ph + 32, "text-anchor": "middle", "font-size": 22 }, svg, "Summe");
  }
}

/* ---------- Formel ---------- */
function abbr(arr, max) {
  if (arr.length <= max) return arr;
  return [...arr.slice(0, 3), null, ...arr.slice(-2)];
}
function joinTerms(items) {
  return items.map(x => x === null ? '<span class="dim">…</span>' : x).join(" + ");
}
function leftSide() {
  const k = S.k;
  if (S.mode === "le") return `P(X ≤ ${k})`;
  if (S.mode === "ge") return `P(X ≥ ${k})`;
  if (S.mode === "eq") return `P(X = ${k})`;
  return `P(${S.a} ≤ X ≤ ${k})`;
}
function cdf(P, k) { let s = 0; for (let i = 0; i <= k && i < P.length; i++) s += P[i]; return s; }

function drawFormula() {
  const P = pmf(S.n, S.p);
  const [lo, hi] = range();
  const idx = []; for (let i = lo; i <= hi; i++) idx.push(i);
  const total = idx.reduce((s, i) => s + P[i], 0);
  const L = `<span class="hl big">${leftSide()}</span>`;
  const lines = [];

  if (S.mode === "eq") {
    const p = S.pFrac ? `(${S.pFrac[0]}/${S.pFrac[1]})` : fmtP(S.p);
    const q = S.pFrac ? `(${S.pFrac[1] - S.pFrac[0]}/${S.pFrac[1]})` : fmtP(1 - S.p);
    lines.push(`<div class="line">${L} <span>=</span>
      <span class="binom"><span class="br">(</span><span class="st"><span>${S.n}</span><span>${S.k}</span></span><span class="br">)</span></span>
      <span>· ${p}<sup>${S.k}</sup> · ${q}<sup>${S.n - S.k}</sup></span>
      <span>≈</span> <span class="hl big">${fmt(total)}</span></div>`);
    lines.push(`<div class="line soft">Nur ein einziger Balken – hier wird nichts aufsummiert.</div>`);
  } else {
    const sym = joinTerms(abbr(idx, 7).map(i => i === null ? null : `P(X=${i})`));
    lines.push(`<div class="line">${L} <span>=</span> <span>${sym}</span></div>`);

    if (S.anim) {
      const shown = S.anim.shown;
      if (shown === 0) {
        lines.push(`<div class="line"><span>=</span> <span class="dim">?</span></div>`);
      } else {
        const rev = idx.slice(0, shown);
        let parts = abbr(rev, 6).map(i => i === null ? null : (i === rev[rev.length - 1] ? `<span class="cur">${fmt(P[i])}</span>` : fmt(P[i])));
        let s = joinTerms(parts);
        if (shown < idx.length) s += ' <span class="dim">+ …</span>';
        const part = rev.reduce((a, i) => a + P[i], 0);
        lines.push(`<div class="line"><span>=</span> <span>${s}</span>
          <span class="soft">&nbsp;&nbsp;Zwischensumme nach ${shown} von ${idx.length} Summanden:</span> <span class="cur big">${fmt(part)}</span></div>`);
      }
    } else {
      const num = joinTerms(abbr(idx, 7).map(i => i === null ? null : fmt(P[i])));
      lines.push(`<div class="line"><span>=</span> <span>${num}</span> <span>≈</span> <span class="hl big">${fmt(total)}</span></div>`);
    }

    if (S.mode === "ge") {
      lines.push(`<div class="line soft">Gegenereignis: ${leftSide()} = 1 − P(X ≤ ${S.k - 1}) = 1 − ${fmt(cdf(P, S.k - 1))} ≈ ${fmt(total)}</div>`);
    } else if (S.mode === "iv") {
      lines.push(`<div class="line soft">Differenz: ${leftSide()} = P(X ≤ ${S.k}) − P(X ≤ ${S.a - 1}) = ${fmt(cdf(P, S.k))} − ${fmt(cdf(P, S.a - 1))} ≈ ${fmt(total)}</div>`);
    } else {
      lines.push(`<div class="line soft">${idx.length} Summanden = ${idx.length} blaue Balken. Jeder Balken hat die Breite 1, seine Fläche ist also P(X = i).</div>`);
    }
  }
  $("formula").innerHTML = lines.join("");
}

/* ---------- Bedienelemente synchronisieren ---------- */
function syncControls() {
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("active", b.dataset.mode === S.mode));
  $("rng-n").value = Math.min(S.n, 100); $("num-n").value = S.n;
  $("rng-p").value = S.p; $("num-p").value = S.pFrac ? `${S.pFrac[0]}/${S.pFrac[1]}` : fmtP(S.p);
  for (const key of ["k", "a"]) { $("rng-" + key).max = S.n; $("rng-" + key).value = S[key]; $("num-" + key).value = S[key]; }
  $("row-a").style.display = S.mode === "iv" ? "" : "none";
  $("lbl-k").textContent = S.mode === "iv" ? "b" : "k";
  $("btn-play").textContent = S.timer ? "⏸ Pause" : (S.anim ? "▶ Weiter" : "▶ Schritt für Schritt");
  $("tog-stack").setAttribute("aria-pressed", S.stack);
  $("tog-vals").setAttribute("aria-pressed", S.vals);
  $("tog-crop").setAttribute("aria-pressed", S.crop);
  const isEq = S.mode === "eq";
  $("btn-play").disabled = $("btn-step").disabled = isEq;
  $("btn-play").style.opacity = $("btn-step").style.opacity = isEq ? 0.4 : 1;
}
function render() { syncControls(); drawChart(); drawFormula(); }

/* ---------- Ereignisse ---------- */
document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
for (const key of ["n", "p", "k", "a"]) {
  $("rng-" + key).addEventListener("input", e => setVal(key, parseFloat(e.target.value)));
  if (key !== "p") $("num-" + key).addEventListener("change", e => setVal(key, parseFloat(e.target.value.replace(",", "."))));
  $("num-" + key).addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
}
document.querySelectorAll(".pm[data-key]").forEach(b => b.addEventListener("click", () => {
  const key = b.dataset.key; setVal(key, S[key] + parseFloat(b.dataset.d));
}));
/* p als Bruch: "1/6" wird exakt gerechnet (wie im TR), nicht als 0,1667 */
function setPText(txt) {
  const t = txt.trim().replace(/,/g, ".");
  const m = t.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (m) {
    const z = +m[1], nn = +m[2];
    if (nn > 0 && z <= nn) { S.p = z / nn; S.pFrac = [z, nn]; stopAnim(); render(); return; }
    render(); return;
  }
  setVal("p", parseFloat(t));
}
$("num-p").addEventListener("change", e => setPText(e.target.value));
$("btn-p16").addEventListener("click", () => setPText("1/6"));
$("btn-play").addEventListener("click", togglePlay);
$("btn-step").addEventListener("click", stepOnce);
$("tog-stack").addEventListener("click", () => { S.stack = !S.stack; render(); });
$("tog-vals").addEventListener("click", () => { S.vals = !S.vals; render(); });
$("tog-crop").addEventListener("click", () => { S.crop = !S.crop; render(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); setVal("k", S.k + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); setVal("k", S.k - 1); }
  else if (e.key === " ") { e.preventDefault(); if (S.mode !== "eq") togglePlay(); }
  else if (e.key === "Enter") { if (S.mode !== "eq") stepOnce(); }
});
/* Bühne skalieren: Layout wird für mind. 1600 × 1000 berechnet und auf den Bildschirm verkleinert,
   damit auch 1024 × 768-Beamer und das iPad alles vollständig zeigen. */
function fitStage() {
  const W = window.innerWidth, H = window.innerHeight;
  const u = Math.min(W / 1600, H / 1000, 1);
  const st = $("stage");
  st.style.width = (W / u) + "px"; st.style.height = (H / u) + "px";
  st.style.transform = `scale(${u})`;
}
window.addEventListener("resize", fitStage);
fitStage();
new ResizeObserver(() => drawChart()).observe($("chartbox"));
render();
</script>
</body>
</html>
