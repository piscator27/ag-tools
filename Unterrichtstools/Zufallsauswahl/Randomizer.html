<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namens-Randomizer</title>
<style>
  :root{
    --tafel:#1b2b22;
    --tafel-rand:#3c5a44;
    --kreide:#f2ede1;
    --kreide-matt:#c9c2ae;
    --gelb:#e8c468;
    --karte:#22352a;
    --karte-rand:#4a6b53;
    --rot:#c96a5a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--tafel);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.03), transparent 60%);
    color:var(--kreide);
    font-family:"Segoe UI", Verdana, Arial, sans-serif;
  }

  header{
    padding:18px 24px 10px 24px;
    border-bottom:2px dashed var(--tafel-rand);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:22px;
  }
  header h1{
    margin:0 18px 0 0;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--gelb);
    font-weight:600;
  }
  .feld{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:13px;
    color:var(--kreide-matt);
  }
  select, button{
    font-family:inherit;
    font-size:15px;
    background:var(--karte);
    color:var(--kreide);
    border:1.5px solid var(--karte-rand);
    border-radius:6px;
    padding:7px 10px;
  }
  select:focus, button:focus{outline:2px solid var(--gelb);}
  button{cursor:pointer;}
  button:hover{border-color:var(--gelb);}

  #ziehen{
    background:var(--gelb);
    color:#20291a;
    font-weight:700;
    border-color:var(--gelb);
    padding:9px 20px;
    font-size:16px;
  }
  #ziehen:hover{filter:brightness(1.08);}
  #ziehen:disabled{
    opacity:0.4;
    cursor:not-allowed;
    filter:none;
  }

  #zuruecksetzen{color:var(--kreide-matt);}

  main{
    display:flex;
    height:calc(100% - 96px);
  }

  #schuelerliste{
    width:230px;
    flex-shrink:0;
    padding:14px 16px;
    overflow-y:auto;
    border-right:2px dashed var(--tafel-rand);
  }
  #schuelerliste .hinweis{
    font-size:12px;
    color:var(--kreide-matt);
    margin:0 0 10px 0;
  }
  .schueler{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 4px;
    border-radius:4px;
    font-size:15px;
    cursor:pointer;
    user-select:none;
  }
  .schueler:hover{background:rgba(255,255,255,0.04);}
  .schueler input{
    width:16px;height:16px;
    accent-color:var(--gelb);
    cursor:pointer;
  }
  .schueler.abwesend{color:var(--kreide-matt);text-decoration:line-through;opacity:0.55;}
  .schueler.gezogen{color:var(--kreide-matt);opacity:0.45;}
  .schueler.gezogen span::after{
    content:" ✓";
    color:var(--gelb);
  }

  #anzahlInfo{
    margin-top:14px;
    font-size:12.5px;
    color:var(--kreide-matt);
  }

  #buehne{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    position:relative;
  }

  #anzeige{
    font-size:min(11vw, 110px);
    font-weight:800;
    color:var(--kreide);
    letter-spacing:1px;
    min-height:1.2em;
    line-height:1.2;
    padding:0 20px;
  }
  #anzeige.spinning{
    color:var(--kreide-matt);
    animation:pulse 0.08s infinite alternate;
  }
  @keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.03);}
  }
  #anzeige.leer{
    font-size:22px;
    color:var(--kreide-matt);
    font-weight:400;
  }

  #restInfo{
    margin-top:26px;
    font-size:15px;
    color:var(--kreide-matt);
  }
  #restInfo b{color:var(--gelb);}

  #logo{
    position:fixed;
    right:16px;
    bottom:12px;
    font-size:26px;
    font-weight:800;
    color:rgba(255,255,255,0.18);
    letter-spacing:1px;
    pointer-events:none;
    user-select:none;
  }

  @media (max-width:700px){
    main{flex-direction:column;}
    #schuelerliste{width:100%;border-right:none;border-bottom:2px dashed var(--tafel-rand);max-height:30vh;}
  }
</style>
</head>
<body>

<header>
  <h1>Namen zufällig wählen</h1>

  <div class="feld">
    <label for="klasseAuswahl">Klasse</label>
    <select id="klasseAuswahl"></select>
  </div>

  <div class="feld">
    <label>&nbsp;</label>
    <button id="ziehen">Zufällig auswählen</button>
  </div>

  <div class="feld">
    <label>&nbsp;</label>
    <button id="zuruecksetzen">Runde zurücksetzen</button>
  </div>
</header>

<main>
  <div id="schuelerliste">
    <p class="hinweis">Häkchen entfernen, wenn jemand fehlt:</p>
    <div id="schuelerBox"></div>
    <div id="anzahlInfo"></div>
  </div>

  <div id="buehne">
    <div id="anzeige" class="leer">Klasse wählen und auf „Zufällig auswählen" klicken.</div>
    <div id="restInfo"></div>
  </div>
</main>

<div id="logo">Fi</div>

<!-- Echte Klassenlisten (lokal, nicht im Repo). Fehlt die Datei,
     greifen die Beispielnamen weiter unten. -->
<script src="klassen.js"></script>
<script>
/* ============================================================
   Hier neue Klassen ergänzen.
   Einfach nach demselben Muster einen weiteren Eintrag
   im KLASSEN-Objekt anlegen:

   "Meine Klasse 5b": [
     "Anna", "Ben", "Clara", ...
   ],

   Der Name links (in Anführungszeichen) erscheint in der
   Dropdown-Auswahl oben.
   ============================================================ */
const KLASSEN = window.KLASSEN || {
  "Beispielklasse A": [
    "Anna", "Ben", "Clara", "David", "Elif", "Finn", "Greta", "Hugo", "Ida", "Jonas", "Karla",
    "Leon", "Mara", "Nico", "Olivia", "Paul", "Quirin", "Rosa", "Sami", "Tom", "Ulla",
    "Viktor", "Wanda", "Xenia", "Yusuf", "Zoe", "Amir", "Bea", "Carlo", "Dilara"
  ],
  "Beispielklasse B": [
    "Alina", "Bela", "Cem", "Dora", "Emil", "Frida", "Georg", "Hanna", "Ilias", "Jule", "Kian",
    "Lotta", "Mats", "Nele", "Oskar", "Pia", "Rafael", "Sina", "Theo", "Vera", "Wim", "Yara",
    "Zeno", "Anton", "Britta", "Cosima", "Dennis", "Ella", "Felix", "Gina"
  ]
};

const klasseAuswahl = document.getElementById("klasseAuswahl");
const schuelerBox = document.getElementById("schuelerBox");
const anzahlInfo = document.getElementById("anzahlInfo");
const anzeige = document.getElementById("anzeige");
const restInfo = document.getElementById("restInfo");
const ziehenBtn = document.getElementById("ziehen");

let gezogen = new Set(); // Namen, die in dieser Runde schon dran waren

// Klassen-Dropdown befüllen
Object.keys(KLASSEN).forEach(name=>{
  let opt = document.createElement("option");
  opt.value = name;
  opt.textContent = name;
  klasseAuswahl.appendChild(opt);
});

function schuelerlisteAnzeigen(){
  schuelerBox.innerHTML = "";
  gezogen = new Set();
  anzeigeZuruecksetzen();

  const namen = KLASSEN[klasseAuswahl.value] || [];
  namen.forEach(name=>{
    let label = document.createElement("label");
    label.className = "schueler";
    let cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = true;
    cb.dataset.name = name;
    cb.addEventListener("change", ()=>{
      label.classList.toggle("abwesend", !cb.checked);
      anzahlAktualisieren();
    });
    let text = document.createElement("span");
    text.textContent = name;
    label.appendChild(cb);
    label.appendChild(text);
    label.dataset.name = name;
    schuelerBox.appendChild(label);
  });
  anzahlAktualisieren();
}

function anzahlAktualisieren(){
  const anwesend = Array.from(schuelerBox.querySelectorAll("input:checked"))
    .map(cb => cb.dataset.name);
  const uebrig = anwesend.filter(n => !gezogen.has(n));
  restInfo.innerHTML = "<b>" + uebrig.length + "</b> von " + anwesend.length + " noch übrig";
  ziehenBtn.disabled = uebrig.length === 0;
}

function anzeigeZuruecksetzen(){
  anzeige.textContent = "Klasse wählen und auf Zufällig auswählen klicken.";
  anzeige.className = "leer";
  restInfo.textContent = "";
}

klasseAuswahl.addEventListener("change", schuelerlisteAnzeigen);

document.getElementById("zuruecksetzen").addEventListener("click", ()=>{
  gezogen = new Set();
  schuelerBox.querySelectorAll(".schueler").forEach(l => l.classList.remove("gezogen"));
  anzeige.textContent = "Bereit für die nächste Runde.";
  anzeige.className = "leer";
  anzahlAktualisieren();
});

ziehenBtn.addEventListener("click", ()=>{
  const anwesend = Array.from(schuelerBox.querySelectorAll("input:checked"))
    .map(cb => cb.dataset.name);
  const kandidaten = anwesend.filter(n => !gezogen.has(n));

  if(kandidaten.length === 0){
    alert("Alle anwesenden Schüler:innen waren in dieser Runde schon dran. Bitte zurücksetzen.");
    return;
  }

  ziehenBtn.disabled = true;

  // kurze "Spin"-Animation durch die Kandidaten, endet beim echten Gewinner
  anzeige.className = "spinning";
  const gewinner = kandidaten[Math.floor(Math.random() * kandidaten.length)];
  let durchlaeufe = 14;
  let i = 0;

  const intervall = setInterval(()=>{
    anzeige.textContent = kandidaten[Math.floor(Math.random() * kandidaten.length)];
    i++;
    if(i >= durchlaeufe){
      clearInterval(intervall);
      anzeige.textContent = gewinner;
      anzeige.className = "";
      gezogen.add(gewinner);
      const label = schuelerBox.querySelector('.schueler[data-name="' + CSS.escape(gewinner) + '"]');
      if(label) label.classList.add("gezogen");
      anzahlAktualisieren();
    }
  }, 70);
});

schuelerlisteAnzeigen();
</script>
</body>
</html>
