<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MatheFussball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101010;
    color: #f0f0f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 18px 0 10px 0;
    background: #101010;
  }

  .team-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .team-label {
    font-size: 28px;
    letter-spacing: 2px;
    color: #cfcfcf;
  }

  .score {
    font-size: 90px;
    font-weight: bold;
    line-height: 1;
    min-width: 100px;
    text-align: center;
    color: #ffffff;
  }

  .score-sep {
    font-size: 80px;
    font-weight: bold;
    color: #777;
    padding-bottom: 6px;
  }

  .buttons {
    display: flex;
    gap: 14px;
  }

  .btn {
    font-size: 34px;
    width: 64px;
    height: 64px;
    border-radius: 12px;
    border: none;
    background: #2a2a2a;
    color: #fff;
    cursor: pointer;
  }

  .btn:active {
    background: #3d3d3d;
  }

  #center-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 0 4px 0;
  }

  #kickoff {
    font-size: 30px;
    padding: 14px 34px;
    border-radius: 14px;
    border: none;
    background: #1f6b2f;
    color: #ffffff;
    cursor: pointer;
  }

  #kickoff:active {
    background: #278239;
  }

  #field-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: calc(100% - 300px);
  }

  #field {
    position: relative;
    width: 92vw;
    max-width: 1400px;
    height: 100%;
    max-height: 560px;
    background: #1e6b34;
    border: 6px solid #ffffff;
    box-sizing: border-box;
  }

  /* die 5 senkrechten Linien (feste Ballpositionen) */
  .field-line {
    position: absolute;
    top: 0;
    width: 4px;
    height: 100%;
    background: #ffffff;
  }

  /* Tore links / rechts, wie in der Skizze: ein Rechteck je Seite */
  .goal-box {
    position: absolute;
    top: 30%;
    width: 8%;
    height: 40%;
    border: 4px solid #ffffff;
    box-sizing: border-box;
  }
  .goal-box.left { left: 0; border-left: none; }
  .goal-box.right { right: 0; border-right: none; }

  #ball {
    position: absolute;
    width: 46px;
    height: 46px;
    background: #ffffff;
    border-radius: 50%;
    border: 3px solid #202020;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: grab;
  }

  #ball:active {
    cursor: grabbing;
  }

  footer {
    position: fixed;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 15px;
    color: #888888;
    pointer-events: none;
  }

  #fi-mark {
    position: fixed;
    bottom: 6px;
    right: 12px;
    font-size: 16px;
    color: #666666;
    font-weight: bold;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="scoreboard">
    <div class="team-block">
      <div class="team-label">TEAM 1</div>
      <div class="score" id="score1">0</div>
      <div class="buttons">
        <button class="btn" onclick="changeScore(1,-1)">−</button>
        <button class="btn" onclick="changeScore(1,1)">+</button>
      </div>
    </div>

    <div class="score-sep">:</div>

    <div class="team-block">
      <div class="team-label">TEAM 2</div>
      <div class="score" id="score2">0</div>
      <div class="buttons">
        <button class="btn" onclick="changeScore(2,-1)">−</button>
        <button class="btn" onclick="changeScore(2,1)">+</button>
      </div>
    </div>
  </div>

  <div id="center-area">
    <button id="kickoff" onclick="resetBall()">⚽ Anstoß</button>
  </div>

  <div id="field-wrapper">
    <div id="field">
      <div class="goal-box left"></div>
      <div class="goal-box right"></div>
      <div id="ball"></div>
    </div>
  </div>

  <footer>FischerTools</footer>
  <div id="fi-mark">Fi</div>

<script>
  let score1 = 0;
  let score2 = 0;

  function changeScore(team, delta) {
    if (team === 1) {
      score1 = Math.max(0, score1 + delta);
      document.getElementById('score1').textContent = score1;
    } else {
      score2 = Math.max(0, score2 + delta);
      document.getElementById('score2').textContent = score2;
    }
  }

  const field = document.getElementById('field');
  const ball = document.getElementById('ball');

  // Feste Positionen entlang der Mittellinie des Feldes:
  // Tor links -- Linie1 -- Linie2 -- Mitte -- Linie4 -- Linie5 -- Tor rechts
  const positions = [6, 21, 35.5, 50, 64.5, 79, 94]; // in % der Feldbreite
  const centerIndex = 3;

  function drawLines() {
    // Linien nur an den 5 mittleren Positionen (nicht auf den Toren)
    for (let i = 1; i < positions.length - 1; i++) {
      const line = document.createElement('div');
      line.className = 'field-line';
      line.style.left = positions[i] + '%';
      field.insertBefore(line, ball);
    }
  }

  function resetBall() {
    setBallToIndex(centerIndex);
  }

  function setBallToIndex(index) {
    ball.style.left = positions[index] + '%';
    ball.style.top = '50%';
  }

  let dragging = false;

  function getRelativeX(clientX) {
    const rect = field.getBoundingClientRect();
    let x = (clientX - rect.left) / rect.width;
    x = Math.min(Math.max(x, 0), 1) * 100;
    return x;
  }

  function nearestIndex(xPercent) {
    let closest = 0;
    let minDist = Math.abs(xPercent - positions[0]);
    for (let i = 1; i < positions.length; i++) {
      const d = Math.abs(xPercent - positions[i]);
      if (d < minDist) {
        minDist = d;
        closest = i;
      }
    }
    return closest;
  }

  function moveBallFree(clientX) {
    const xPercent = getRelativeX(clientX);
    ball.style.left = xPercent + '%';
    ball.style.top = '50%';
  }

  function snapBall(clientX) {
    const xPercent = getRelativeX(clientX);
    const idx = nearestIndex(xPercent);
    setBallToIndex(idx);
  }

  // Maus
  ball.addEventListener('mousedown', function(e) {
    dragging = true;
    e.preventDefault();
  });

  window.addEventListener('mousemove', function(e) {
    if (dragging) {
      moveBallFree(e.clientX);
    }
  });

  window.addEventListener('mouseup', function(e) {
    if (dragging) {
      snapBall(e.clientX);
      dragging = false;
    }
  });

  // Touch
  ball.addEventListener('touchstart', function(e) {
    dragging = true;
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    if (dragging && e.touches.length > 0) {
      moveBallFree(e.touches[0].clientX);
      e.preventDefault();
    }
  }, { passive: false });

  window.addEventListener('touchend', function(e) {
    if (dragging) {
      snapBall(e.changedTouches[0].clientX);
      dragging = false;
    }
  }, { passive: false });

  drawLines();
  resetBall();
</script>

</body>
</html>
