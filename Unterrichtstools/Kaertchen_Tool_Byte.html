<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Binärsystem: Kärtchen-Trick (5 und 8 Bit)</title>
<style>
  :root{
    --bg:#1a1a1a;
    --fg:#f2f2f2;
    --muted:#9a9a9a;
    --accent:#fccb00;
    --accent2:#3b6ea5;
    --ok:#5cb85c;
    --bad:#e05555;
    --card-off:#2a2a2a;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;min-height:100vh;
    background:var(--bg);color:var(--fg);
    font-family:"Verdana","Segoe UI",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:4vh 4vw;
  }
  h1{ font-size:clamp(20px,3.4vw,32px); margin:0 0 0.6em 0; text-align:center; }
  p.sub{ color:var(--muted); margin:0 0 2em 0; text-align:center; font-size:clamp(13px,1.6vw,16px); max-width:60ch; }

  .modebar{
    display:flex; gap:10px; margin-bottom:2.2em; flex-wrap:wrap; justify-content:center;
  }
  .modebtn{
    padding:0.6em 1.4em; border-radius:6px; border:1.5px solid var(--accent2);
    background:#0f2436; color:var(--fg); cursor:pointer; font-size:15px;
  }
  .modebtn.active{ background:var(--accent2); }

  .target{
    font-size:clamp(28px,5vw,44px); font-weight:bold; color:var(--accent);
    margin-bottom:1.2em; text-align:center; min-height:1.4em;
  }

  .cards{
    display:flex; gap:clamp(8px,2vw,20px); flex-wrap:wrap; justify-content:center;
    margin-bottom:2em;
  }
  .slot{ display:flex; flex-direction:column; align-items:center; gap:0.5em; }
  .slotbit{
    font-family:"Courier New",monospace; font-weight:bold; font-size:clamp(20px,3vw,32px);
    color:#666; min-height:1.2em;
  }
  .slotbit.on{ color:var(--accent); }
  .card{
    width:clamp(70px,12vw,110px); height:clamp(90px,15vw,140px);
    border-radius:10px; background:var(--card-off);
    border:2px solid #444; display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px,4vw,40px); font-weight:bold; color:var(--fg);
    cursor:pointer; user-select:none; transition:all 0.12s;
  }
  .card:hover{ border-color:var(--accent); }
  .card.on{
    background:var(--accent); color:#111; border-color:var(--accent);
    box-shadow:0 0 18px rgba(252,203,0,0.5);
  }

  .cards.n8{ flex-wrap:nowrap; }
  .cards.n8 .card{
    width:clamp(40px,9.6vw,104px); height:clamp(70px,14vw,130px);
    font-size:clamp(18px,3.4vw,38px);
  }
  .cards.n8 .slotbit{ font-size:clamp(16px,2.8vw,30px); }
  .anzahl{
    color:var(--muted); font-size:clamp(14px,1.8vw,18px); margin-bottom:1.6em; text-align:center;
  }
  .anzahl b{ color:var(--accent); }
  .result{
    display:flex; gap:clamp(16px,4vw,48px); flex-wrap:wrap; justify-content:center;
    margin-bottom:1.6em; text-align:center;
  }
  .result .block{ min-width:140px; }
  .result .label{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:0.3em; }
  .result .value{ font-size:clamp(28px,4.4vw,42px); font-weight:bold; font-variant-numeric:tabular-nums; }
  .result .value.bits{ font-family:"Courier New",monospace; letter-spacing:4px; }
  .modebar.small{ margin-bottom:1.4em; }
  .modebar.small .modebtn{ font-size:13px; padding:0.45em 1.1em; }

  .feedback{
    font-size:clamp(16px,2.4vw,22px); font-weight:bold; min-height:1.6em;
    margin-bottom:1.6em; text-align:center;
  }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--bad); }

  .actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  button.action{
    padding:0.7em 1.6em; border-radius:6px; border:none;
    background:var(--accent2); color:var(--fg); font-size:15px; cursor:pointer;
  }
  button.action:hover{ background:#4a84c0; }
  button.action.secondary{ background:#333; }
  button.action.secondary:hover{ background:#444; }

  .fi-logo{
    position:fixed;bottom:1.5vh;right:2vw;
    font-size:2vh;color:var(--fg);opacity:0.3;font-weight:bold;letter-spacing:1px;
  }
</style>
</head>
<body>

<h1>Der Kärtchen-Trick</h1>
<p class="sub">Klicke die Kärtchen an oder aus. Unten siehst du sofort, welche Zahl das ergibt — und wie sie im Binärsystem aussieht. Jedes Kärtchen ist ein Bit: an = 1, aus = 0.</p>

<div class="modebar small">
  <button class="modebtn active" id="size5" onclick="setSize(5)">5 Kärtchen (bis 31)</button>
  <button class="modebtn" id="size8" onclick="setSize(8)">8 Kärtchen = 1 Byte (bis 255)</button>
</div>

<div class="modebar">
  <button class="modebtn active" id="modeFrei" onclick="setMode('frei')">Frei ausprobieren</button>
  <button class="modebtn" id="modeRaetsel" onclick="setMode('raetsel')">Rätsel: finde die Zahl</button>
</div>

<div class="target" id="target"></div>

<div class="cards" id="cards"></div>

<div class="anzahl" id="anzahl"></div>

<div class="result">
  <div class="block">
    <div class="label">Summe</div>
    <div class="value" id="sumValue">0</div>
  </div>
  <div class="block">
    <div class="label">Bitfolge</div>
    <div class="value bits" id="bitsValue"></div>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<div class="actions">
  <button class="action" id="btnNeu" onclick="neueZahl()" style="display:none">Neue Zahl</button>
  <button class="action secondary" onclick="reset()">Zurücksetzen</button>
</div>

<div class="fi-logo">Fi</div>

<script>
  var ALLE = [128, 64, 32, 16, 8, 4, 2, 1];
  var anzahlKarten = 5;
  var werte = [];
  var kartenStatus = [];
  var mode = 'frei';
  var zielZahl = null;

  var cardsEl = document.getElementById('cards');

  function baueKarten() {
    werte = ALLE.slice(ALLE.length - anzahlKarten);
    kartenStatus = werte.map(function() { return false; });
    cardsEl.innerHTML = '';
    cardsEl.classList.toggle('n8', anzahlKarten === 8);
    werte.forEach(function(w, i) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      var d = document.createElement('div');
      d.className = 'card';
      d.textContent = w;
      d.onclick = function() { toggle(i); };
      var b = document.createElement('div');
      b.className = 'slotbit';
      slot.appendChild(d);
      slot.appendChild(b);
      cardsEl.appendChild(slot);
    });
  }

  function setSize(n) {
    anzahlKarten = n;
    document.getElementById('size5').classList.toggle('active', n === 5);
    document.getElementById('size8').classList.toggle('active', n === 8);
    baueKarten();
    if (mode === 'raetsel') { neueZahl(); } else { render(); }
  }

  function toggle(i) {
    kartenStatus[i] = !kartenStatus[i];
    render();
  }

  function summe() {
    var s = 0;
    for (var i = 0; i < werte.length; i++) if (kartenStatus[i]) s += werte[i];
    return s;
  }

  function bitfolge() {
    var b = '';
    for (var i = 0; i < werte.length; i++) b += kartenStatus[i] ? '1' : '0';
    return b;
  }

  function render() {
    var cardEls = cardsEl.querySelectorAll('.card');
    var bitEls = cardsEl.querySelectorAll('.slotbit');
    for (var i = 0; i < cardEls.length; i++) {
      cardEls[i].classList.toggle('on', kartenStatus[i]);
      bitEls[i].textContent = kartenStatus[i] ? '1' : '0';
      bitEls[i].classList.toggle('on', kartenStatus[i]);
    }
    var anz = Math.pow(2, anzahlKarten);
    document.getElementById('anzahl').innerHTML =
      anzahlKarten + ' Kärtchen = ' + anzahlKarten + ' Bit → <b>' + anz + '</b> verschiedene Zahlen (0 bis ' + (anz - 1) + ')';
    document.getElementById('sumValue').textContent = summe();
    document.getElementById('bitsValue').textContent = bitfolge();

    var fb = document.getElementById('feedback');
    if (mode === 'raetsel' && zielZahl !== null) {
      var s = summe();
      if (s === zielZahl) {
        fb.textContent = 'Richtig! ' + zielZahl + ' = ' + bitfolge();
        fb.className = 'feedback ok';
      } else if (s > zielZahl) {
        fb.textContent = 'Zu viel — nimm ein Kärtchen weg.';
        fb.className = 'feedback bad';
      } else if (s < zielZahl) {
        fb.textContent = 'Noch zu wenig — welches Kärtchen fehlt?';
        fb.className = 'feedback bad';
      }
    } else {
      fb.textContent = '';
      fb.className = 'feedback';
    }
  }

  function reset() {
    kartenStatus = werte.map(function() { return false; });
    render();
  }

  function setMode(m) {
    mode = m;
    document.getElementById('modeFrei').classList.toggle('active', m === 'frei');
    document.getElementById('modeRaetsel').classList.toggle('active', m === 'raetsel');
    document.getElementById('btnNeu').style.display = (m === 'raetsel') ? 'inline-block' : 'none';
    if (m === 'raetsel') {
      neueZahl();
    } else {
      zielZahl = null;
      document.getElementById('target').textContent = '';
      reset();
    }
  }

  function neueZahl() {
    zielZahl = 1 + Math.floor(Math.random() * (Math.pow(2, anzahlKarten) - 1));
    document.getElementById('target').textContent = 'Finde die Zahl: ' + zielZahl;
    reset();
  }

  baueKarten();
  render();
</script>
</body>
</html>
